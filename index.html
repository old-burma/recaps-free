<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recaps — Video Recap လုပ်ရန်</title>
<!-- V244: PWA — manifest + NLO icons (the icon files live beside this
     page; the service worker story is in coi-sw.js: the PWA asset
     cache is merged INTO that worker, because a scope can hold only
     one worker and the MT export path depends on the COI one) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B0B0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Padauk:wght@400;700&family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
html,body{height:100%}
body{font-family:'Inter','Padauk','Noto Sans Myanmar',system-ui,sans-serif;color:#F2F2F2;background:#0B0B0B;height:100vh;height:100dvh;overflow:hidden;overflow-x:clip}
/* V210 CapCut-style shell: the app fills the viewport and the PAGE never
   scrolls — preview / timeline / toolbar are fixed zones and only the
   bottom panel scrolls internally. V211: the transport is a GLASS bar
   overlaid on the preview frame's bottom edge (not a flow zone).
   V212: the top app bar is GONE — the preview zone is the first element
   and the layout takes the full viewport height. */
.layout{padding:0;max-width:980px;margin:0 auto;height:100vh;height:100dvh}
.main{padding:0;height:100%}
.tabpage{display:none}.tabpage.active{display:block}
#page-recap{display:flex;flex-direction:column;height:100%}
/* V212: no top app bar — only the sheet offset var remains (the sheet
   wrap starts at the preview frame's bottom edge, measured live) */
:root{--sheetTop:50dvh}
.icon-btn{width:38px;height:38px;flex:0 0 38px;border-radius:11px;border:1.5px solid #2C2C2C;background:#1E1E1E;font-size:16px;cursor:pointer;color:#F2F2F2;display:flex;align-items:center;justify-content:center;font-family:inherit}
.pill-btn{padding:8px 9px;border-radius:999px;border:1.5px solid #2C2C2C;background:#1E1E1E;font-family:inherit;font-size:12.5px;font-weight:700;color:#F2F2F2;cursor:pointer;white-space:nowrap}
.pill-btn:disabled{opacity:.55}
/* ===== cards / fields / buttons (dark surfaces) ===== */
.card{background:#171717;border:1px solid #262626;border-radius:20px;padding:18px;color:#F2F2F2;margin-bottom:14px}
.card h3{font-size:16px;font-weight:800;margin-bottom:6px;color:#F2F2F2}
.card h3.studio-h{color:#FFFFFF;font-size:17px}
.card p{font-size:13px;color:#9A9A9A;line-height:1.55}
.btn{padding:12px 18px;border-radius:999px;border:1.5px solid #2C2C2C;cursor:pointer;background:#1E1E1E;color:#F2F2F2;font-size:14px;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:#FFFFFF;color:#000;border:none;box-shadow:0 8px 18px rgba(0,0,0,.32);width:100%}
.btn.primary.outline{background:#1E1E1E;color:#FFFFFF;border:2px solid #FFFFFF;box-shadow:none}
.btn.light{background:#1E1E1E;color:#F2F2F2;border:1.5px solid #2C2C2C}
.btn.green{background:#FFFFFF;color:#000;border:none;box-shadow:0 8px 18px rgba(0,0,0,.30)}
.btn.danger{background:transparent;color:#F2F2F2;border:1.5px solid #8A8A8A}
.btn.danger.armed{background:#FFFFFF;color:#000;border-color:#FFFFFF;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.btn.small{padding:8px 13px;font-size:12.5px}
.btn:disabled{opacity:.55}
.btn.off{opacity:.45}
.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#E8E8E8}
.field input[type=text],.field input[type=url],.field input[type=number],.field input[type=password],.field textarea{width:100%;padding:11px 13px;border-radius:13px;border:1.5px solid #2C2C2C;font-family:inherit;font-size:14px;background:#101010;color:#F2F2F2}
.field textarea{min-height:110px;line-height:1.7;resize:vertical}
.field .hint{font-size:11.5px;color:#8A8A8A;margin-top:4px}
.hint{font-size:11.5px;color:#8A8A8A;line-height:1.55}
.field.bad input,.field.bad textarea{border-color:#FFFFFF;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.err-text{display:none;font-size:12.5px;color:#FFFFFF;font-weight:600;margin-top:5px}.err-text.show{display:block}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:#2C2C2C;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:#FFFFFF;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#FFFFFF;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);cursor:pointer}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:#2C2C2C}
input[type=checkbox]{width:19px;height:19px;accent-color:#FFFFFF;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.picker-row{display:flex;gap:10px;flex-wrap:wrap}
.pick-btn{flex:1;padding:12px;border-radius:14px;border:1.5px solid #2C2C2C;background:#1E1E1E;cursor:pointer;font-family:inherit;text-align:left}
.pick-btn b{display:block;font-size:13.5px;color:#F2F2F2}.pick-btn span{font-size:12px;color:#9A9A9A}
.switch-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
/* V254: the knob MUST contrast with the track in BOTH states — the
   V253 monochrome pass left ON as a white knob on a white track (the
   switch read as one solid white pill, ON/OFF indistinguishable).
   OFF = dark gray track + visible outline + light-gray knob;
   ON  = white track + BLACK knob. Still strictly black & white. */
.tgl{width:50px;height:28px;border-radius:999px;background:#3A3A3A;position:relative;cursor:pointer;flex:0 0 50px;box-shadow:inset 0 0 0 1.5px #6E6E6E}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#BDBDBD;transition:all .18s}
.tgl.on{background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #FFFFFF}.tgl.on::after{left:25px;background:#111111}
video.preview{width:100%;border-radius:12px;background:#000}
video.preview.framed{max-height:40vh;max-height:40dvh;object-fit:contain}
.file-info{font-size:12.5px;color:#9A9A9A;margin-top:6px;word-break:break-all}
/* waveform loading */
.wave{display:none;align-items:flex-end;gap:2.5px;height:16px}
.wave i{display:block;width:3.5px;background:currentColor;border-radius:2px;animation:wv 0.9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{height:5px}50%{height:16px}}
.btn.loading .wave{display:inline-flex}.btn.loading .btn-label{opacity:.85}
.pill-btn.loading .wave{display:inline-flex}.pill-btn.loading .btn-label{opacity:.85}
body.locked{overflow:hidden}
/* bottom sheet — V213: the home of EVERY toolbar feature pop-up
   (Burmese Voice app style), plus the small pickers + the cue editor */
.sheet-wrap{position:fixed;left:0;right:0;bottom:0;top:var(--sheetTop,0px);z-index:100;display:none}
.sheet-wrap.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:#171717;border-radius:24px 24px 0 0;padding:16px 18px 14px;color:#F2F2F2;height:50vh;height:50dvh;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet h3{font-size:16px;font-weight:800;margin:0}
/* V214: the close controls live in the sheet FRAME, not the content —
   a sticky header row (title + ✕) and a footer (✓ ပြီး) bracket the
   scrolling body, so EVERY sheet (features, pickers, cue pop-up, Key)
   always shows both, no matter which home is mounted inside */
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;margin-bottom:12px}
.sheet-x{flex:none;width:42px;height:42px;border-radius:50%;border:1.5px solid #2C2C2C;background:#1B1B1B;color:#F2F2F2;font-size:16px;line-height:1;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0}
.sheet-x:active{background:#262626}
#sheetBody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-foot{flex:none;padding-top:12px}
.sheet-foot .btn{width:100%}
/* V213: EVERY feature pop-up (the Burmese Voice app pattern) shares the
   same size — the wrap starts at the middle of the viewport, so the
   sheet fills the wrap exactly. V231 (user order): every sheet is
   EXACTLY the bottom 50dvh of the viewport (vh fallback first), the
   body scrolls internally, header/footer stay pinned by the flex
   column. */
.sheet-wrap.voicePop .sheet{height:50vh;height:50dvh;max-height:100%}
.opt{width:100%;text-align:left;padding:14px;border-radius:14px;border:1.5px solid #2C2C2C;background:#1B1B1B;margin-bottom:9px;cursor:pointer;font-family:inherit;color:#F2F2F2}
.opt b{display:block;font-size:14px;color:#F2F2F2}.opt span{font-size:12.5px;color:#9A9A9A}
.opt.sel{border-color:#FFFFFF;background:rgba(255,255,255,.14)}
.opt.dim{opacity:.45;cursor:not-allowed}.opt.dim b{color:#9A9A9A}
/* notices — V255: the toast home moves from the TOP of the screen to
   the BOTTOM (user order 2026-11-16 17:52: the top pop covered the
   stage; he circled the empty strip between the timeline and the
   bottom toolbar). Anchored above the toolbar (~50px + safe-area,
   plus a gap), centred, width capped as before. pointer-events:none:
   a notice never blocks a tap (it carries no buttons). z-index stays
   200 (above the z-100 sheets) because fetch errors are reported
   while the source sheet is open and must be visible there. */
#notice{position:fixed;bottom:calc(68px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:200;width:min(520px,calc(100% - 28px));display:none;padding:13px 16px;border-radius:15px;font-size:13.5px;font-weight:600;box-shadow:0 14px 34px rgba(0,0,0,.5);pointer-events:none}
#notice.show{display:block}#notice.ok{background:#F2F2F2;color:#111111;border:1px solid #F2F2F2}#notice.err{background:#1B1B1B;color:#FFFFFF;border:1.5px solid #FFFFFF}#notice.info{background:#262626;color:#F2F2F2;border:1px solid #3A3A3A}
#donePop{position:fixed;inset:0;z-index:210;display:none;place-items:center;background:rgba(0,0,0,.55)}
#donePop.show{display:grid}
#donePop .box{background:#1E1E1E;color:#F2F2F2;border:1px solid #2C2C2C;border-radius:22px;padding:26px 22px;width:min(400px,calc(100% - 40px));text-align:center}
.logbox{background:#0B0B0B;color:#E8E8E8;border-radius:13px;padding:11px 13px;font-size:11.5px;max-height:130px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-top:10px;display:none}
.exp-prog{margin-top:12px;background:#111111;border:1px solid #2C2C2C;border-radius:13px;padding:12px 14px;max-width:100%;box-sizing:border-box;overflow:hidden}
.exp-prog-head{display:flex;align-items:center;gap:10px}
.exp-prog .wave{display:inline-flex;color:#FFFFFF}
.exp-pct{font-size:26px;font-weight:800;color:#FFFFFF;line-height:1}
.exp-bar{height:8px;border-radius:5px;background:#262626;margin-top:10px;overflow:hidden}
.exp-bar-fill{height:100%;width:0%;background:#FFFFFF;border-radius:5px;transition:width .2s ease}
/* V253 (bug 1): the preview canvas box is FULLY CSS-determined — a fixed
   height the pumps' backing-store changes (up to export resolution) can
   never influence, so an export can no longer resize the visible layout */
.exp-prev{width:100%;height:44vh;height:44dvh;object-fit:contain;background:#000;border:1px solid #2C2C2C;border-radius:13px;margin-top:10px;box-sizing:border-box}
.exp-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:12px;color:#9A9A9A}
.exp-meta span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-meta .exp-elapsed{font-variant-numeric:tabular-nums;white-space:nowrap}
.exp-meta .exp-eta{white-space:nowrap;color:#FFFFFF;font-variant-numeric:tabular-nums}
/* ===== preview zone (large, centred, top) + placeholder + overlays ===== */
.vid-sticky{flex:0 0 auto;background:#000;padding:8px 10px 6px;position:relative;display:flex;flex-direction:column;height:50vh;height:50dvh}
.pick-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pick-row .file-info{margin-top:0}
.vid-wrap{position:relative;max-width:600px;margin:auto}
/* V216 WYSIWYG aspect stage: in a fixed-canvas mode the stage IS the
   export canvas (same ratio, same fit) — a blurred cover copy of the
   video fills the canvas (.preview-bg) and the sharp video sits inside
   with object-fit:contain (shown WHOLE, nothing cut). The 9:16 +
   landscape special case (.stg-square) moves the sharp video into the
   centred 1:1 region (top 21.875%, height 56.25% of the 9:16 stage =
   the export's picY 280/1280 and 720/1280 square), so the subtitle
   band below it sits in the blur pad exactly as exported.
   V233 FIXED REGION (user order 2026-11-14): the stage REGION
   (.vid-sticky) is a fixed box of exactly 50dvh (vh fallback first) at
   EVERY aspect — it never grows or shrinks, so nothing below it ever
   jumps when the aspect changes. The canvas-aspect FRAME (.vid-wrap)
   is centred inside the region (margin:auto in the region's flex
   column) and sized to FIT the region: width capped by the region's
   content height (50dvh − the 14px sticky padding) times the canvas
   ratio, so frame height = min(region content height, width × H/W)
   and the frame's aspect is always exactly the canvas aspect.
   Original uses the same fit with the ratio supplied per file by
   applyStage via --stg-ar. The transport is REGION chrome now: it
   lives outside the frame, pinned to the region's bottom edge, so it
   never moves either. Sheets take the bottom 50dvh (see .sheet). */
.vid-wrap.stg-916,.vid-wrap.stg-169,.vid-wrap.stg-11,.vid-wrap.stg-orig{overflow:hidden;background:#000;border-radius:12px}
.vid-wrap.stg-916{aspect-ratio:9/16;width:min(600px,100%,calc((50vh - 14px)*0.5625));width:min(600px,100%,calc((50dvh - 14px)*0.5625))}
.vid-wrap.stg-169{aspect-ratio:16/9;width:min(600px,100%,calc((50vh - 14px)*1.7778));width:min(600px,100%,calc((50dvh - 14px)*1.7778))}
.vid-wrap.stg-11{aspect-ratio:1/1;width:min(600px,100%,calc(50vh - 14px));width:min(600px,100%,calc(50dvh - 14px))}
.vid-wrap.stg-orig{aspect-ratio:var(--stg-ar,1.7778);width:min(600px,100%,calc((50vh - 14px)*var(--stg-ar,1.7778)));width:min(600px,100%,calc((50dvh - 14px)*var(--stg-ar,1.7778)))}
.vid-wrap .preview-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.vid-wrap.stg-916 .preview,.vid-wrap.stg-169 .preview,.vid-wrap.stg-11 .preview,.vid-wrap.stg-orig .preview{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:contain;border-radius:0;z-index:1}
.vid-wrap.stg-square .preview{top:21.875%;bottom:auto;height:56.25%}
.vid-wrap.stg-916 .ph-box,.vid-wrap.stg-169 .ph-box,.vid-wrap.stg-11 .ph-box,.vid-wrap.stg-orig .ph-box{position:absolute;inset:0;aspect-ratio:auto;max-height:none;border-radius:0;z-index:2}
.ph-box{background:#141414;border-radius:12px;aspect-ratio:16/9;max-height:38vh;max-height:38dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.ph-ic{font-size:38px}
.ph-t{font-size:15px;font-weight:700;color:#F2F2F2}
.ph-s{font-size:12px;color:#9A9A9A}
.sub-overlay{position:absolute;left:4%;right:4%;bottom:9%;text-align:center;font-family:'Padauk','Noto Sans Myanmar',sans-serif;font-weight:700;font-size:clamp(15px,4.4vw,25px);line-height:1.55;color:#fff;text-shadow:0 0 7px rgba(0,0,0,.95),0 2px 4px rgba(0,0,0,.95),-1px 0 0 rgba(0,0,0,.85),1px 0 0 rgba(0,0,0,.85),0 -1px 0 rgba(0,0,0,.85);pointer-events:auto;cursor:grab;touch-action:none;display:none;white-space:pre-line;z-index:5}
.sub-overlay:active{cursor:grabbing}
/* V233/V234: the overlay is the exported BLOCK box — applySubPos sets
   its top + height from subBlockGeom (frame fractions) and the text
   lives in .sub-inner, centred in the block exactly like textPNG
   centres it in the (now tight) export PNG; the optional plate rides
   the inner div (textPNG draws its plate around the text block) */
.sub-overlay{flex-direction:column;align-items:center;justify-content:center}
.sub-inner{width:100%;box-sizing:border-box}
.mode-pill{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:700;padding:5px 14px;border-radius:999px;pointer-events:none;z-index:8;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;transition:opacity .45s ease}
.mode-pill.hide{opacity:0}
.title-overlay{position:absolute;top:max(46px,13%);left:5%;right:5%;text-align:center;font-weight:800;font-size:clamp(16px,5vw,30px);line-height:1.4;color:#FFE92E;text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.8);pointer-events:auto;cursor:grab;touch-action:none;display:none;z-index:4;font-family:'Padauk','Noto Sans Myanmar',sans-serif;white-space:pre-line;transform:translate(-50%,-50%);width:max-content;max-width:94%}
.title-overlay:active{cursor:grabbing}
.logo-overlay{position:absolute;top:12px;left:12px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.92);text-shadow:0 1px 4px rgba(0,0,0,.85);pointer-events:auto;cursor:grab;touch-action:none;display:none;z-index:4;align-items:center;gap:7px;transform:translate(-50%,-50%)}
.logo-overlay:active{cursor:grabbing}
.logo-overlay img{display:block;border-radius:50%}
.logo-overlay .logo-word{display:block;text-align:center;white-space:nowrap}
.text-overlay{position:absolute;transform:translate(-50%,-50%);font-weight:700;line-height:1.5;color:#fff;text-shadow:0 0 7px rgba(0,0,0,.95),0 2px 4px rgba(0,0,0,.95);pointer-events:auto;cursor:grab;touch-action:none;display:none;z-index:6;white-space:nowrap;width:max-content;max-width:none;text-align:center;font-family:'Padauk','Noto Sans Myanmar',sans-serif;padding:2px 8px}
.text-overlay:active{cursor:grabbing}
.frame-border{position:absolute;inset:0;border:3px solid #FFE92E;border-radius:14px;pointer-events:none;display:none;z-index:7}
/* ===== V253: fade preview layer + PiP overlay + extra text overlays ===== */
.fade-layer{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:4}
/* V257 (FIX 4): the change-video control as a floating ICON-ONLY
   button on the stage's top-right corner (user order 2026-11-16
   18:36 — moved out of the quick row, no text). It lives inside
   .vid-wrap so it rides the stage at every aspect; z-index 9 keeps
   it above the stage overlays yet far below sheets (100+) and the
   notice (200). Monochrome like the rest of the UI. */
.vid-wrap .stage-change{position:absolute;top:8px;right:8px;z-index:9;height:38px;border-radius:999px;border:1.5px solid rgba(255,255,255,.38);background:rgba(18,18,18,.72);color:#fff;font-size:13px;font-weight:700;letter-spacing:.02em;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0 14px;font-family:inherit}
.vid-wrap .stage-change:active{transform:scale(.92)}
/* V257 (FIX 6): the Crop editing layer — shown only while the Crop
   sheet is open (JS toggles display); the rect dims everything
   outside itself with the classic 9999px shadow, clipped by the
   wrap's own overflow:hidden. z-index 6: above the video/blur
   layers, below the stage-change button (9) and the sheets. */
.vid-wrap .crop-layer{position:absolute;inset:0;z-index:6}
.vid-wrap .crop-rect{position:absolute;border:1.5px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;touch-action:none;box-sizing:border-box}
.vid-wrap .crop-rect .cr-handle{position:absolute;width:18px;height:18px;border:2px solid #fff;border-radius:50%;background:rgba(18,18,18,.85);box-sizing:border-box;touch-action:none;z-index:2}
.vid-wrap .crop-rect .cr-handle[data-h="nw"]{left:-10px;top:-10px;cursor:nwse-resize}
.vid-wrap .crop-rect .cr-handle[data-h="ne"]{right:-10px;top:-10px;cursor:nesw-resize}
.vid-wrap .crop-rect .cr-handle[data-h="sw"]{left:-10px;bottom:-10px;cursor:nesw-resize}
.vid-wrap .crop-rect .cr-handle[data-h="se"]{right:-10px;bottom:-10px;cursor:nwse-resize}
/* V254: draggable like the logo (pointer-events auto + grab cursor +
   touch-action none), and hard bounds so the preview can never become
   an oversized slab: height auto (natural aspect), max-height 94% of
   the stage with object-fit contain as the last-resort fit */
.pip-overlay{position:absolute;z-index:6;pointer-events:auto;cursor:grab;touch-action:none;border-radius:8px;display:none;height:auto;max-width:60%;max-height:94%;object-fit:contain}
.pip-overlay:active{cursor:grabbing}
.text-overlay.pos-preset{cursor:default;pointer-events:none}
/* ===== V217 Blur tool + colour swatches =====
   .blur-layer sits over the video (z 3, below the app's own overlays)
   and holds one region div per blur region. Region divs are inert
   (pointer-events:none) until the wrap gets .blur-editing (Blur sheet
   open): then they can be dragged / resized and the selected one shows
   its corner handle. The effect itself (backdrop-filter) is always
   live so the preview shows exactly what export will cover. */
.blur-layer{position:absolute;inset:0;z-index:3;pointer-events:none}
.blur-region{position:absolute;border-radius:4px;pointer-events:none;overflow:visible;touch-action:none}
.blur-region.fx-blur{-webkit-backdrop-filter:blur(20px) saturate(.9);backdrop-filter:blur(20px) saturate(.9)}
.blur-region.fx-mosaic{-webkit-backdrop-filter:blur(3px) saturate(.55) contrast(1.15);backdrop-filter:blur(3px) saturate(.55) contrast(1.15);background-image:repeating-conic-gradient(rgba(0,0,0,.20) 0% 25%,rgba(255,255,255,.12) 0% 50%)}
.vid-wrap.blur-editing .blur-region{pointer-events:auto;cursor:move;outline:1.5px dashed rgba(255,255,255,.6)}
.vid-wrap.blur-editing .blur-region.sel{outline:2px solid #FFFFFF}
.blur-region .br-handle{position:absolute;right:-10px;bottom:-10px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;border:2px solid #fff;cursor:nwse-resize;display:none;z-index:2;touch-action:none}
.vid-wrap.blur-editing .blur-region.sel .br-handle{display:block}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:46px;height:36px;border-radius:11px;border:2px solid #2C2C2C;cursor:pointer;padding:0}
.sw.sel{border-color:#FFFFFF;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
/* custom transport — V212: NO glass, NO button backgrounds. The icon
   row (▶/⏸ · ⏪ · times · ⏩) floats fully transparent over the frame —
   white glyphs with a soft drop shadow only — and the seek slider is a
   SEPARATE slim line on its own row at the frame's very bottom edge.
   Auto-hide while playing unchanged (see showTransport). */
.transport{position:absolute;left:0;right:0;bottom:0;z-index:9;display:flex;flex-direction:column;gap:2px;padding:2px 12px 7px;transition:opacity .35s ease}
.transport.hide{opacity:0;pointer-events:none}
.tp-row{display:flex;align-items:center;gap:15px}
.tp-play{background:none;border:none;color:#fff;font-size:21px;line-height:1;padding:3px 4px;cursor:pointer;font-family:inherit;text-shadow:0 1px 5px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9)}
.tp-skip{background:none;border:none;color:#fff;font-size:16px;line-height:1;padding:3px 4px;cursor:pointer;font-family:inherit;text-shadow:0 1px 5px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9)}
.tp-time{font-size:11.5px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.tp-right{margin-left:auto}
.tp-seek{width:100%;height:3px;background:rgba(255,255,255,.35)}
.tp-seek::-webkit-slider-thumb{width:13px;height:13px;border-width:2px}
.tp-seek::-moz-range-thumb{width:12px;height:12px;border-width:2px}
.tp-seek::-moz-range-track{height:3px;background:rgba(255,255,255,.35)}
/* ===== timeline — V213: TWO tracks only (subtitle cues + voice) ===== */
.tl-wrap{flex:0 0 auto;background:#101010;border-top:1px solid #262626;border-bottom:1px solid #262626;padding:2px 0 2px}
.tl-scroll{overflow-x:auto;overflow-y:hidden}
.tl-inner{position:relative;min-width:100%}
.tl-track{position:relative;height:15px}
.tl-track-subs{height:18px}
.tl-block{position:absolute;top:2px;border-radius:4px;font-size:9.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;font-family:inherit;text-align:left}
.tl-sblock{height:14px;line-height:14px;padding:0 5px;background:rgba(255,255,255,.14);border:1px solid #8A8A8A;color:#F2F2F2}
.tl-sblock.cur{background:#FFFFFF;border-color:#FFFFFF;color:#000000;font-weight:700}
.tl-voblock{height:12px;line-height:12px;padding:0 6px;background:#1D1D1D;border:1px solid #8A8A8A;color:#E8E8E8}
.tl-voblock.stale{background:repeating-linear-gradient(45deg,#2A2A2A,#2A2A2A 6px,#1B1B1B 6px,#1B1B1B 12px);border-color:#8A8A8A;color:#F2F2F2}
.tl-playhead{position:absolute;top:0;bottom:0;width:2px;background:#FFFFFF;box-shadow:0 0 6px rgba(255,255,255,.8);z-index:4;pointer-events:none}
/* ===== V222: time ruler + video waveform rows (above the cue track) ===== */
.tl-ruler-row{position:relative;height:9px}
.tl-ruler-row canvas{display:block}
.tl-wave-row{position:relative;height:12px;border-bottom:1px solid #1D1D1D;margin-bottom:0}
.tl-wave-row canvas{display:block}
.tl-wave-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;color:#9A9A9A;pointer-events:none;letter-spacing:.02em}
/* ===== studio deck (HOME panel content) ===== */
.studio-status{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#C9C9C9;margin:2px 0 14px}
.studio-status .dot{width:9px;height:9px;border-radius:50%;background:#FFFFFF;flex:0 0 9px;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.chip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:420px){.chip-grid{grid-template-columns:repeat(2,1fr)}}
.style-chip,.voice-chip{padding:12px 8px;border-radius:14px;border:1.5px solid #2C2C2C;background:#1B1B1B;font-family:inherit;font-size:13.5px;font-weight:700;color:#C9C9C9;cursor:pointer;text-align:center}
.style-chip.sel,.voice-chip.sel{border-color:#FFFFFF;background:rgba(255,255,255,.14);color:#FFFFFF}
.voice-labelrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.voice-labelrow>label{font-size:13px;font-weight:700;color:#E8E8E8;margin-bottom:0}
.field .duck-chk{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#F2F2F2;cursor:pointer;margin-bottom:0}
.btn-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn-row2 .btn{width:100%;padding:9px 10px;font-size:13px;white-space:nowrap}
/* SRT cue list rows — V213: summary rows; tap one to edit it in the
   per-cue pop-up (text / start / end / save / delete live there) */
.cue-row{display:flex;gap:8px;align-items:center;padding:8px;border:1.5px solid #2C2C2C;border-radius:12px;margin-bottom:8px;background:#1B1B1B}
.cue-row.cur{border-color:#FFFFFF;background:rgba(255,255,255,.12)}
.cue-row .cue-del{flex:none;margin-left:auto;background:transparent;border:1.5px solid #8A8A8A;color:#F2F2F2;border-radius:10px;padding:7px 11px;font-size:15px;line-height:1;cursor:pointer;font-family:inherit}
.cue-row .cue-del:active{background:rgba(255,255,255,.32)}
.cue-main{flex:1;min-width:0;cursor:pointer}
.cue-txt{display:block;font-size:13px;line-height:1.5;color:#F2F2F2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cue-when{display:block;font-size:11px;color:#9A9A9A;margin-top:1px}
.cue-ic{width:32px;height:32px;flex:0 0 32px;border-radius:9px;border:none;background:rgba(255,255,255,.16);color:#FFFFFF;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.cue-pop textarea{min-height:64px}
.warnbox{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.12);color:#FFFFFF;font-size:13px;font-weight:600;line-height:1.55}
/* voice mini player */
.vp-row{display:flex;align-items:center;gap:10px}
.vp-play{width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:none;background:#FFFFFF;color:#000;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vp-track{flex:1;height:6px;border-radius:99px;background:#2C2C2C;overflow:hidden}
.vp-bar{height:100%;width:0%;background:#FFFFFF;border-radius:99px;transition:width .2s linear}
.vp-time{font-size:12px;color:#9A9A9A;font-weight:600;white-space:nowrap}
/* ===== V231: the V210 status strip is DELETED (user order) — its
   Script / Voice segments are gone entirely and the Export segment
   moved into the Main quick row as the qtExport pill (same .qtgl
   styling as the SRT / Voice pills; runExport's loading wave +
   disabled state now hang off .qtgl below). ===== */
.deck-sec{margin-top:14px}
.deck-sec:first-child{margin-top:2px}
.deck-ttl{font-size:13.5px;font-weight:800;color:#F2F2F2;margin-bottom:8px}
.mode-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-btn{padding:8px 8px;border-radius:13px;border:1.5px solid #2C2C2C;background:#1B1B1B;font-family:inherit;cursor:pointer;text-align:center;width:100%}
/* V257 (FIX 5): "pick one" invitation — while NEITHER mode is chosen
   yet, the two cards take turns breathing a soft white glow (the
   second card is offset by half a cycle, so the pulse sweeps across
   the pair). Monochrome only, transform/opacity/box-shadow-class
   properties only, and it stops for good the moment a mode is
   chosen (.attn is removed by syncModeAttn). Paused while a sheet
   is open (body.locked), like the app's other ambient motion. */
.mode-btn.attn{animation:modeAttn 1.8s ease-in-out infinite}
.mode-btns .mode-btn.attn:nth-child(2){animation-delay:.9s}
@keyframes modeAttn{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0);border-color:#2C2C2C}50%{box-shadow:0 0 16px 3px rgba(255,255,255,.30);border-color:rgba(255,255,255,.70)}}
body.locked .mode-btn.attn{animation-play-state:paused}
/* V258: "ready to export" — when the script exists AND the audio is
   settled (original-audio mode, or a complete + fresh voiceover),
   syncExportAttn puts .attn on the quick-row Export pill and it
   breathes the SAME white glow as the mode cards (shared modeAttn
   keyframes: box-shadow + border-color only — the pill's box, label
   and width NEVER change; the V253 blowup lesson). It stops the
   moment an export starts or readiness is lost. Paused while a
   sheet is open, like the app's other ambient motion. */
.qtgl.attn{animation:modeAttn 1.8s ease-in-out infinite}
body.locked .qtgl.attn{animation-play-state:paused}
/* V259: the workflow step tracker — a slim strip in the main row
   (between the mode cards and the quick row; the stage's fixed
   height and the quick row itself are untouched). Pending steps are
   dimmed, the current step is a solid white pill, done steps carry
   a ✅ and a quiet filled chip — monochrome, like the rest of the
   editor. */
.stepbar{display:flex;align-items:center;gap:5px;margin:8px 0 0;flex-wrap:wrap}
.wstep{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:#1C1C22;color:#8A8A93;border:1px solid #2C2C33;white-space:nowrap}
.wstep.cur{background:#FFFFFF;color:#111111;border-color:#FFFFFF}
.wstep.done{background:#26262C;color:#FFFFFF;border-color:#3A3A3A}
.wsep{color:#55555C;font-size:11px}
.mode-btn b{display:block;font-size:13.5px;color:#F2F2F2}
.mode-btn span{display:block;font-size:10.5px;color:#9A9A9A;margin-top:1px;font-weight:600}
.mode-btn.sel{border-color:#FFFFFF;background:rgba(255,255,255,.14)}
.mode-btn.sel b{color:#FFFFFF}
.mode-btn:disabled{opacity:.55;cursor:default}
.style-row{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:9px;padding:2px 2px 4px;-webkit-overflow-scrolling:touch}
.style-row::-webkit-scrollbar{display:none}
.style-row .style-chip{padding:6px 9px;border-radius:999px;font-size:12px;flex:0 0 auto}
/* ===== V211 horizontal scroll rows (chips / pickers / options) ===== */
.scroll-row{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;-webkit-overflow-scrolling:touch}
.scroll-row::-webkit-scrollbar{display:none}
.scroll-row>*{flex:0 0 auto}
.voice-row .voice-chip{padding:9px 13px;border-radius:999px;font-size:12.5px}
.picker-pill{padding:9px 13px;font-size:12.5px;white-space:nowrap}
/* ===== V215 Voice Create — Burmese Voice app sheet layout =====
   ONE big select-style voice field; sliders as label+value header over
   a fat track with a large round thumb; a စမ်းသပ်/Reset action row; and
   a BIG pale full-width generate button (dark text, dark wave bars via
   currentColor while busy). Colours stay the Recaps dark/orange theme. */
.voice-field{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;border-radius:14px;border:1.5px solid #2C2C2C;background:#1C1C1C;color:#F2F2F2;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-align:left}
.voice-field:active{background:#232323}
.vf-caret{color:#9A9A9A;font-size:14px;flex:0 0 auto}
.vs-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.vs-head label{font-size:13.5px;font-weight:700;color:#E8E8E8}
.vs-val{font-size:19px;font-weight:800;color:#fff;white-space:nowrap}
input[type=range].vs-range{height:9px}
input[type=range].vs-range::-webkit-slider-thumb{width:27px;height:27px}
input[type=range].vs-range::-moz-range-thumb{width:25px;height:25px}
input[type=range].vs-range::-moz-range-track{height:9px}
.voice-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 12px}
.btn.voice-gen{background:linear-gradient(180deg,#F5F5F5,#E4E4E4);color:#141414;border:none;border-radius:16px;min-height:56px;font-size:16.5px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.btn.voice-gen:disabled{opacity:.55;box-shadow:none}
.vpick-sec{font-size:12.5px;font-weight:800;color:#9A9A9A;margin:14px 2px 8px}
.aspect-opts .opt{flex:0 0 auto;width:212px;margin-bottom:0}
/* ===== V210 bottom panel + toolbar (CapCut-style) ===== */
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:#171717;border-top:1px solid #262626}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px 2px}
.panel-title{font-size:15px;font-weight:800;color:#F2F2F2}
.panel-done{padding:7px 16px;border-radius:999px;border:none;background:#FFFFFF;color:#000;font-weight:800;font-family:inherit;cursor:pointer;font-size:13px;flex:0 0 auto}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 18px}
.toolbar{flex:0 0 auto;display:flex;gap:2px;overflow-x:auto;background:#101010;border-top:1px solid #262626;padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
.tool-btn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:48px;padding:4px 3px;border:none;background:transparent;color:#C9C9C9;font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;border-radius:10px}
.tool-btn .tic{font-size:16px;line-height:1}
.tool-btn.sel{color:#FFFFFF;background:rgba(255,255,255,.12)}
/* ===== V230: Main row (mode/style + quick toggles) + column spacer =====
   The app column fills 100dvh and the toolbar is its LAST element: a
   flexible spacer above the toolbar absorbs every leftover pixel, so
   the toolbar always sits at the very bottom (it floated mid-screen
   whenever the old flex:1 panel was hidden). The Main row sits between
   the pinned frame and the timeline: the Original/New mode buttons +
   style chips (moved out of the Script sheet) and the SRT / Voice
   quick toggles, all in the slim compact chrome. */
.col-spacer{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
/* V236: Script-generation LIVE progress block — lives INSIDE the
   spacer (the empty area between the timeline and the toolbar the
   user circled, 2026-11-14). The spacer stays a flex child of the
   column exactly as before (flex:1 1 auto absorbs the slack, the
   toolbar stays pinned); the block is display:none except during a
   Create run, so an idle app shows the same empty area as always. */
.gen-prog{width:min(430px,88%);text-align:center;padding:8px 4px}
.gen-prog-pct{font-size:46px;font-weight:800;color:#FFFFFF;line-height:1.05;font-variant-numeric:tabular-nums}
.gen-prog-bar{height:6px;border-radius:99px;background:#2C2C2C;overflow:hidden;margin:10px 0 8px}
.gen-prog-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#FFFFFF,#FFFFFF);transition:width .25s ease}
.gen-prog-meta{display:flex;gap:8px;justify-content:center;align-items:baseline;font-size:12.5px;font-weight:600;color:#C9C9C9}
.gen-prog-unit{color:#9A9A9A;font-weight:700;font-variant-numeric:tabular-nums}
.main-row{flex:0 0 auto;background:#101010;border-top:1px solid #262626;padding:7px 10px 8px}
.main-row .style-row{margin-top:6px}
.quick-row{display:flex;align-items:center;gap:7px;margin-top:7px;max-width:100%;overflow:hidden;flex-wrap:nowrap}
.qtgl{flex:0 0 auto;padding:5px 12px;border-radius:999px;border:1.5px solid #2C2C2C;background:#1B1B1B;color:#9A9A9A;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.qtgl.on{border-color:#FFFFFF;background:rgba(255,255,255,.14);color:#FFFFFF}
.qtgl:disabled{opacity:.55}
.qtgl.loading .wave{display:inline-flex}
.create-mini{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#C9C9C9;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.create-mini .dot{width:8px;height:8px;border-radius:50%;background:#FFFFFF;flex:0 0 8px;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
/* V230 custom colour pickers (Subs / Title / Text sheets) */
.clr-inp{width:100%;height:38px;padding:3px;border-radius:11px;border:1.5px solid #2C2C2C;background:#1B1B1B;cursor:pointer}
/* ===== V242: PC/laptop layout (user order 2026-11-15) — an ADDITIVE
   desktop layer. Below 900px NOTHING in this block applies and the
   phone layout stays exactly as V241 left it. On wide screens the
   editor becomes two columns (stage left at full editor height, the
   Main row / timeline / spacer stacked in a right rail, toolbar
   spanning the bottom) and every bottom sheet becomes a CENTRED
   DIALOG instead of a half-height sheet stretched across the screen.
   All drag handlers already use pointer events, so the mouse works
   everywhere with no JS change; the only JS addition is an Esc-to-
   close handler gated on this same breakpoint (see keydown below). */
@media (min-width:900px){
.layout{max-width:1560px}
#page-recap{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,430px);grid-template-rows:auto auto 1fr auto;grid-template-areas:"stage main" "stage timeline" "stage spacer" "toolbar toolbar"}
.vid-sticky{grid-area:stage;height:auto;min-height:0}
.main-row{grid-area:main}
.tl-wrap{grid-area:timeline}
.col-spacer{grid-area:spacer}
.toolbar{grid-area:toolbar;justify-content:center;padding-top:8px}
.tool-btn{min-width:62px}
.tool-btn:hover{background:rgba(255,255,255,.06)}
.opt:hover{border-color:#3A3A3A}
.vid-wrap{max-width:none}
.vid-wrap.stg-916{width:min(100%,calc((100vh - 150px)*0.5625));width:min(100%,calc((100dvh - 150px)*0.5625))}
.vid-wrap.stg-169{width:min(100%,calc((100vh - 150px)*1.7778));width:min(100%,calc((100dvh - 150px)*1.7778))}
.vid-wrap.stg-11{width:min(100%,calc(100vh - 150px));width:min(100%,calc(100dvh - 150px))}
.vid-wrap.stg-orig{width:min(100%,calc((100vh - 150px)*var(--stg-ar,1.7778)));width:min(100%,calc((100dvh - 150px)*var(--stg-ar,1.7778)))}
.sheet-wrap{top:0}
.sheet-wrap.open{display:flex;align-items:center;justify-content:center}
.sheet{position:relative;left:auto;right:auto;bottom:auto;width:min(680px,94vw);height:auto;max-height:88vh;max-height:88dvh;border-radius:24px}
.sheet-wrap.voicePop .sheet{height:auto;max-height:88vh;max-height:88dvh}
}
.btn.armed{background:#FFFFFF;border-color:#FFFFFF;color:#000}
/* ===== V250: editor URL box progress (own names — the V246 ks-prog
   styles were removed with the Key Scenes page) ===== */
.url-prog{margin-top:12px}
.url-prog-pct{font-size:26px;font-weight:800}
.url-prog-bar{height:8px;border-radius:99px;background:#2C2C2C;overflow:hidden;margin:6px 0}
.url-prog-fill{height:100%;width:0;background:#FFFFFF;border-radius:99px;transition:width .25s}
.url-prog-meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:#9A9A9A}
</style>
</head>
<body>
<div class="layout"><main class="main">
<!-- Recap editor — content injected by JS -->
<section class="tabpage active" id="page-recap"></section>
</main></div>
<div class="sheet-wrap" id="sheetWrap"><div class="sheet-bg" id="sheetBg"></div><div class="sheet"><div class="sheet-head"><h3 id="sheetTitle"></h3><button class="sheet-x" id="sheetClose" type="button" aria-label="ပိတ်">✕</button></div><div id="sheetBody"></div><div class="sheet-foot"><button class="btn primary" id="sheetDone" type="button">✓ ပြီး</button></div></div></div>
<div id="notice"></div>
<div id="donePop"><div class="box"><div style="font-size:34px">✅</div><h3 style="margin:8px 0" id="doneTitle">ရပါပြီ</h3><p id="doneText" style="font-size:13.5px;color:#9A9A9A"></p><button class="btn primary" id="doneOk" style="margin-top:14px">ဟုတ်ကဲ့</button></div></div>
<script>
'use strict';
/* ================= Recaps Stage 1 — 100% client-side =================
   FFmpeg core (single-thread, no COOP/COEP needed):

   one height on the stage and another in the exported file).

   moved down to the bottom"): the V233 box was the full 170·S-tall PNG
   band with the text centred inside it, and the containment clamp
   capped the BAND top at H − bandH. bandH scales with the canvas
   WIDTH (S = W/720), so on a 16:9 canvas the band was 453px of a
   1080px frame and the visible text could never get near the bottom —
   its centre maxed at ~79% of H. Positioning is now anchored to the
   VISIBLE TEXT BLOCK instead: the exported subtitle PNG is a TIGHT
   block (the cue's rendered lines × line height + the plate padding
   when the band plate is on — subBlockHFor/subTextLayout, the exact
   layout textPNG draws), and subPosY is that block's TOP as a frame

   now the tight block. Containment clamps the block top to

/* V240 (D8): last-resort error surface — a synchronous throw inside a
   click handler (or a promise rejection nobody caught) used to vanish

   real message through the notice, throttled so an error storm
   cannot spam it. */
let _jsErrAt=0;
function surfaceJsError(msg){const m=String(msg==null?'':msg).trim().slice(0,180);if(!m)return;const now=Date.now();if(now-_jsErrAt<3000)return;_jsErrAt=now;try{showNotice('⚠️ Error: '+m,'err')}catch(e){}}

/* Sheet geometry (V231, user order): the preview/stage takes the TOP
   50% of the screen and every bottom sheet takes the BOTTOM 50% — the
   sheet wrap starts at the middle of the VISIBLE viewport and the
   sheet itself is exactly 50dvh tall (see .sheet). --sheetTop is half
   of window.innerHeight (the visible height — the same quantity dvh
   measures, so the two stay in lockstep as the browser chrome shows
   and hides) and is refreshed on resize and at every sheet open.
   (Pre-V231 the wrap started at the pinned frame's bottom edge and
   sheets were capped at min(68vh,100%).) */
function syncPinGeometry(){
 const de=document.documentElement;

}

 return _dbOpening}
async function idbTx(mode,fn){let lastErr=null;for(let a=0;a<3;a++){const db=await openDB();try{return await new Promise((res,rej)=>{const tx=db.transaction('videos',mode);const out={};fn(tx.objectStore('videos'),out);tx.oncomplete=()=>res(out.val);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('transaction aborted'))})}catch(e){lastErr=e;if(/closing|InvalidStateError/i.test((e.name||'')+' '+(e.message||''))){_db=null;continue}throw e}}throw lastErr}
async function idbAdd(item){return idbTx('readwrite',(s,o)=>{const q=s.add(item);q.onsuccess=()=>{o.val=q.result}})}
/* ================= V250: custom FONT upload =================
   Up to 3 user font files (.ttf/.otf/.woff/.woff2) live in slots
   1..3. The BYTES persist in RecapsDB's 'fonts' store (v3); the
   slot display names + the per-area choices (subtitles / Title /
   Text) persist in SETTINGS (fontName1..3 and fontSub/fontTitle/
   fontText: 0 = built-in default, 1..3 = slot). A slot registers
   under the fixed family name 'NLOFont<slot>' via the FontFace
   API — an upload is accepted only once FontFace.load() succeeds,
   so an unusable file never reaches storage. On boot every stored
   font is re-registered (fontRestoreAll); all rendering (stage DOM
   overlays + export canvas) asks fontFamFor(area) for the family. */
const FONT_AREA_KEY={sub:'fontSub',title:'fontTitle',text:'fontText'};
const _fontFaces={};
let _fontGen=0; /* V259: bumped whenever a slot's FontFace is replaced or removed — folded into the subtitle PNG + layout cache keys, because a re-uploaded font keeps the SAME family name ('NLOFont<slot>') and the old keys would otherwise serve the previous font's renders forever */
let _fontRestoreP=null;
function fontSlotOf(area){const v=parseInt(SETTINGS[FONT_AREA_KEY[area]||'fontSub'],10);return (v>=1&&v<=3)?v:0}
function fontFamFor(area){const s=fontSlotOf(area);return (s&&_fontFaces[s])?('NLOFont'+s):''}
function fontStackOf(fam){return fam?'"'+fam+'", Padauk, "Noto Sans Myanmar", sans-serif':'Padauk, "Noto Sans Myanmar", sans-serif'}
function fontStackCss(area){const fam=fontFamFor(area);return fam?'"'+fam+'", \'Padauk\', \'Noto Sans Myanmar\', sans-serif':'\'Padauk\',\'Noto Sans Myanmar\',sans-serif'}
function fontSlotName(slot){return String(SETTINGS['fontName'+slot]||'').trim()}
function fontSlotFilled(slot){return !!fontSlotName(slot)||!!_fontFaces[slot]}
async function fontIdb(mode,fn,arg){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('fonts',mode);const st=tx.objectStore('fonts');const out={};try{fn(st,out,arg)}catch(e){rej(e);return}tx.oncomplete=()=>res(out.val);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('transaction aborted'))})}
async function fontIdbPut(slot,rec){return fontIdb('readwrite',(s,o,a)=>{s.put(a)},{slot:slot,name:rec.name,type:rec.type,buf:rec.buf})}
async function fontIdbAll(){return fontIdb('readonly',(s,o)=>{const q=s.getAll();q.onsuccess=()=>{o.val=q.result||[]}})}
async function fontIdbDel(slot){return fontIdb('readwrite',(s,o,a)=>{s.delete(a)},slot)}
async function fontRegister(slot,buf){
 const fam='NLOFont'+slot;
 const face=new FontFace(fam,buf);
 await face.load();
 if(face.status&&face.status!=='loaded')throw new Error('Font load status: '+face.status);
 if(_fontFaces[slot]){try{document.fonts.delete(_fontFaces[slot])}catch(e){}}
 document.fonts.add(face);_fontFaces[slot]=face;_fontGen++;
 return face;
}
function fontRestoreAll(){
 if(_fontRestoreP)return _fontRestoreP;
 _fontRestoreP=(async()=>{
  let recs=[];try{recs=await fontIdbAll()}catch(e){recs=[]}
  for(const r of recs){if(!r||!r.buf)continue;try{await fontRegister(r.slot,r.buf);if(r.name&&!fontSlotName(r.slot))SETTINGS['fontName'+r.slot]=r.name}catch(e){/* a stored font that no longer loads is skipped — areas fall back to Default */}}
  if(window.__fontUiRefresh)window.__fontUiRefresh();
 })();
 return _fontRestoreP;
}
/* choose a slot (0 = Default) for one area; persists + refreshes UI */
function fontChoose(area,slot){
 slot=(slot>=1&&slot<=3)?slot:0;
 SETTINGS[FONT_AREA_KEY[area]]=slot;saveSettings();
 if(window.__fontUiRefresh)window.__fontUiRefresh();
}
/* delete a slot entirely: bytes + registration + name go; any area
   that used it falls back to Default, with a notice (per spec) */
async function fontDeleteSlot(slot){
 try{await fontIdbDel(slot)}catch(e){}
 if(_fontFaces[slot]){try{document.fonts.delete(_fontFaces[slot])}catch(e){}delete _fontFaces[slot]}_fontGen++;
 SETTINGS['fontName'+slot]='';
 let used=false;
 for(const area of Object.keys(FONT_AREA_KEY)){if(fontSlotOf(area)===slot){SETTINGS[FONT_AREA_KEY[area]]=0;used=true}}
 saveSettings();
 if(window.__fontUiRefresh)window.__fontUiRefresh();
 if(used)showNotice('ℹ️ ဖျက်လိုက်သော Font ကို သုံးနေသော နေရာများအတွက် မူရင်း Font ပြန်သုံးထားပါတယ်','info');
 return used;
}
/* validate + store an uploaded font file; returns true on success.
   Validation IS the FontFace load — a file the platform cannot load
   as a font is rejected with an instructive notice, never stored. */
async function fontHandleFile(file,area,slotHint){
 if(!file)return false;
 let slot=(slotHint>=1&&slotHint<=3&&!fontSlotFilled(slotHint))?slotHint:0;
 if(!slot){for(let s=1;s<=3;s++){if(!fontSlotFilled(s)){slot=s;break}}}
 if(!slot){showNotice('⚠️ Font slot ၃ ခု ပြည့်နေပါပြီ — အရင် Font တစ်ခု ဖျက်ပြီးမှ ထပ်တင်ပါ','err');return false}
 let buf=null;
 try{buf=await file.arrayBuffer()}catch(e){showNotice('⚠️ Font file ဖတ်မရပါ — file အမှန် ပြန် ရွေးပါ','err');return false}
 try{await fontRegister(slot,buf)}
 catch(e){showNotice('⚠️ ဒီ file က Font အဖြစ် သုံးမရပါ — .ttf / .otf Font file အမှန် ရွေးပါ','err');return false}
 const nm=String(file.name||('Font '+slot)).slice(0,60);
 try{await fontIdbPut(slot,{name:nm,type:file.type||'',buf:buf})}catch(e){/* storage failed (quota / private mode): the registered face still serves this session */}
 SETTINGS['fontName'+slot]=nm;
 if(area&&FONT_AREA_KEY[area])SETTINGS[FONT_AREA_KEY[area]]=slot;
 saveSettings();
 if(window.__fontUiRefresh)window.__fontUiRefresh();
 showNotice('✅ Font တင်ပြီးပါပြီ — '+nm,'ok');
 return true;
}

   (200 in ~1s) and the most reliable in production; gemini-3.5-flash
   second (200, ~1-2s). gemini-3.8-flash still answers but is currently
   very slow / 503-prone — the 45s attempt timeout treats it as busy and
   moves on, so it stays as a mid fallback, never the lead.
   gemini-4-hydrogen (new Gemini 4 series) returned 200 with real text
   in testing but took ~36-88s per call — LAST resort only (the 45s
   attempt timeout will cut off its slower runs). gemini-4-argon /
   gemini-4-carbon are
   deliberately NOT in the chain: they returned instant 429 on three
   separate keys (no free-tier quota), and the 429 policy below would
   burn a ~20s wait + retry on them in every run. gemini-2.5-flash and
   gemini-2.5-flash-lite were dropped: the API now returns 404 for them
   ("no longer available to new users"). Both chains share this order. */

 if(busyErr)throw new Error('⏳ Google server busy ဖြစ်နေပါတယ် — ခဏ စောင့်ပြီး ပြန်ကြိုးစားပါ။ အသေးစိတ်: '+busyErr.message);

}
function cleanLines(txt){return String(txt||'').split('\n').map(s=>s.replace(/^```[a-z]*$/i,'').trim()).filter(Boolean)}

/* ---------- per-chunk result cache — the resume half of the speed fix ----------

   are persisted per file signature (file+size+trim, the txSignature) in
   localStorage. Text only and bounded (<=1MB per signature, one signature
   kept — the app edits one video at a time); quota errors fall back to
   memory-only silently. Transcription chunks key on (sig, 'tx', index);
   translation chunks key on (sig, 'tr:'+content hash, 0) so a chunk is only
   ever reused for the exact source lines it translated. */

/* Bounded parallel map: at most `limit` workers in flight, result order
   preserved. On the first failure no new work starts; in-flight calls still
   finish (and cache) before the error is thrown. */
async function poolMap(items,limit,worker){

  while(next<items.length){
   const i=next++;
   if(firstErr)return;
   try{out[i]=await worker(items[i],i)}catch(e){if(!firstErr)firstErr=e;return}
  }
 }
 const rs=[];for(let k=0;k<Math.min(limit,items.length);k++)rs.push(runner());
 await Promise.all(rs);
 if(firstErr)throw firstErr;
 return out;
}
/* --- transcription: <=60s audio chunks, extracted serially but transcribed
   through a pool of 3 as soon as each chunk's audio is ready ---
   60s chunks: a single long transcription call can return partial output (proven live
   2026-11-12: a 73s video came back as one tail fragment; a 99.8s test call returned
   only the first ~50s). Per-chunk calls + ordered concatenation cover start to end.
   Speed (2026-11-13): ffmpeg.wasm is a single instance, so extraction stays
   serial — but it is fast local work; the API calls are the cost, so each one
   fires the moment ITS chunk is extracted instead of after all of them, and
   3 run at once. Completed chunks are cached (chunkCachePut) so a re-run
   resumes at the first missing chunk. extractOne(i) must return chunk i's
   audio bytes; it is only called for chunks with no cached result. */
const AI_NO_AUDIO='AI_NO_AUDIO';
const TRANSCRIBE_PROMPT='Transcribe ALL of the speech in this audio clip exactly, in its original language, from the very beginning to the very end. Every sentence, in the order spoken — do NOT skip, shorten, summarize or stop early, even if the clip is long. One sentence per line. If a word is unclear, write your best hearing of it and keep going until the end of the audio. Output ONLY the transcript lines — no translation, no labels, no commentary.';
async function transcribeChunksPiped(key,total,extractOne,statusFn,sig,seeded,progFn){

 if(total>1&&done>0)report();

   const job=await take();if(!job)return;

    const txt=await geminiGen(key,[{inlineData:{mimeType:'audio/mp3',data:u8ToB64(job.audio)}},{text:TRANSCRIBE_PROMPT}],0.2,statusFn);
    seeded[job.i]=txt;chunkCachePut(sig,'tx',job.i,txt);done++;if(total>1)report();
   }catch(e){if(!firstErr)firstErr=e}
  }
 }
 const workers=[];for(let w=0;w<Math.min(3,total);w++)workers.push(worker());

 try{
  for(let i=0;i<total;i++){
   if(seeded[i]!=null)continue;
   push({i,audio:await extractOne(i)});
  }
 }catch(e){extractErr=e}

}
function translatePrompt(group){

}
/* Faithful translation, chunked for speed + reliability (2026-11-13): the
   transcript is split into groups of 15 lines and the groups are translated
   through a pool of 3 (order preserved). One giant call for a long video was
   both slow and prone to truncated output; a group whose line count drifts
   gets ONE retry, then its first result is kept (same tolerance as the old
   single call). Completed groups are cached by content hash (see above). */
async function translateFaithful(key,transcript,statusFn,sig,progFn){
 const lines=cleanLines(transcript);
 if(!lines.length)return '';

 for(let i=0;i<lines.length;i+=GROUP)groups.push(lines.slice(i,i+GROUP));
 const total=groups.length;let done=0;

 if(total>1)report();
 const outs=await poolMap(groups,3,async group=>{
  const ck='tr:'+strHash(group.join('\n'));
  if(sig){const c=chunkCacheGet(sig,ck,0);if(c!=null){done++;if(total>1)report();return c}}
  let out=cleanLines(await geminiGen(key,[{text:translatePrompt(group)}],0.2,statusFn,true));
  if(out.length!==group.length){
   const out2=cleanLines(await geminiGen(key,[{text:translatePrompt(group)}],0.2,statusFn,true));
   if(out2.length===group.length)out=out2;
  }
  const text=out.join('\n');
  if(sig)chunkCachePut(sig,ck,0,text);
  done++;if(total>1)report();
  return text;
 });

}
async function sampleFrames(ed,start,end){

 const dur=end-start;const n=Math.max(2,Math.min(12,Math.round(dur/4.5)));
 const sc=Math.min(1,512/v.videoWidth);const cw=Math.max(2,Math.round(v.videoWidth*sc)),ch=Math.max(2,Math.round(v.videoHeight*sc));
 const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');
 const prevT=v.currentTime,wasPaused=v.paused;if(!wasPaused)try{v.pause()}catch(e){}
 const frames=[];
 const seek=t=>new Promise(res=>{let done=false;const fin=()=>{if(done)return;done=true;v.removeEventListener('seeked',fin);res()};v.addEventListener('seeked',fin);try{v.currentTime=t}catch(e){fin()}setTimeout(fin,1600)});
 for(let i=0;i<n;i++){const t=start+dur*(i+0.5)/n;await seek(Math.max(start,Math.min(t,end-0.05)));try{x.drawImage(v,0,0,cw,ch);frames.push(c.toDataURL('image/jpeg',0.7).split(',')[1])}catch(e){}}
 try{v.currentTime=prevT;if(!wasPaused)v.play().catch(()=>{})}catch(e){}
 return frames;
}

function srtTime(sec){sec=Math.max(0,sec||0);let ms=Math.round((sec%1)*1000);let t=Math.floor(sec);if(ms===1000){ms=0;t+=1}const p=(n,l)=>String(n).padStart(l,'0');return p(Math.floor(t/3600),2)+':'+p(Math.floor(t%3600/60),2)+':'+p(t%60,2)+','+p(ms,3)}

function buildSRT(cues,offset,segEnd){
