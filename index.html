<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recaps — Video Recap လုပ်ရန်</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Padauk:wght@400;700&family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
html,body{height:100%}
body{font-family:'Inter','Padauk','Noto Sans Myanmar',system-ui,sans-serif;color:#eafcff;background:radial-gradient(1100px 750px at 88% -12%,rgba(72,225,205,.38),rgba(72,225,205,0) 60%),radial-gradient(900px 700px at -12% 112%,rgba(0,170,205,.32),rgba(0,170,205,0) 62%),linear-gradient(155deg,#03222b 0%,#065263 46%,#0a7d8c 100%);background-attachment:fixed;min-height:100vh}
.layout{padding:14px 14px 28px;max-width:980px;margin:0 auto}
.main{background:rgba(226,248,250,.14);border:1px solid rgba(255,255,255,.22);border-radius:26px;padding:20px;backdrop-filter:blur(20px) saturate(1.25);-webkit-backdrop-filter:blur(20px) saturate(1.25);box-shadow:0 24px 60px rgba(0,25,35,.30)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.logo-badge{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,#1fd3e8,#0a8fa8);box-shadow:0 8px 20px rgba(20,200,225,.45)}
.brand h1{font-size:19px;font-weight:800;color:#fff}.brand small{font-size:11px;color:rgba(220,250,255,.65)}
h2.page-title{font-size:23px;font-weight:800;color:#fff;text-shadow:0 2px 14px rgba(0,40,50,.35)}
.page-sub{color:rgba(230,252,255,.78);font-size:13.5px;margin:3px 0 16px;font-weight:500}
.tabpage{display:none}.tabpage.active{display:block}
.card{background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.65);border-radius:20px;padding:18px;color:#07303c;box-shadow:0 14px 30px rgba(0,45,58,.14);margin-bottom:14px}
.card h3{font-size:16px;font-weight:800;margin-bottom:6px}.card p{font-size:13px;color:#527884;line-height:1.55}
.btn{padding:12px 18px;border-radius:999px;border:none;cursor:pointer;background:#06333f;color:#eafcff;font-size:14px;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:linear-gradient(90deg,#15c3da,#0b9db8);color:#fff;width:100%}
.btn.light{background:rgba(12,170,195,.13);color:#086a7d;border:1px solid rgba(12,170,195,.3)}
.btn.danger{background:#b3261e;color:#fff}.btn.small{padding:8px 13px;font-size:12.5px}
.btn:disabled{opacity:.55}
.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#07303c}
.field input[type=text],.field input[type=number],.field input[type=password],.field textarea{width:100%;padding:11px 13px;border-radius:13px;border:1.5px solid rgba(8,90,108,.25);font-family:inherit;font-size:14px;background:#fff;color:#07303c}
.field textarea{min-height:110px;line-height:1.7;resize:vertical}
.field .hint{font-size:11.5px;color:#6b8b94;margin-top:4px}
.field.bad input,.field.bad textarea{border-color:#d32f2f;box-shadow:0 0 0 3px rgba(211,47,47,.18)}
.err-text{display:none;font-size:12.5px;color:#b3261e;font-weight:600;margin-top:5px}.err-text.show{display:block}
input[type=range]{width:100%;accent-color:#0b9db8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.picker-row{display:flex;gap:10px;flex-wrap:wrap}
.pick-btn{flex:1;padding:12px;border-radius:14px;border:1.5px solid rgba(12,170,195,.35);background:rgba(12,170,195,.08);cursor:pointer;font-family:inherit;text-align:left}
.pick-btn b{display:block;font-size:13.5px;color:#07303c}.pick-btn span{font-size:12px;color:#527884}
.switch-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.tgl{width:50px;height:28px;border-radius:999px;background:#b9ccd1;position:relative;cursor:pointer;flex:0 0 50px}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:all .18s}
.tgl.on{background:#0b9db8}.tgl.on::after{left:25px}
video.preview{width:100%;max-height:52vh;border-radius:14px;background:#000}
.file-info{font-size:12.5px;color:#527884;margin-top:6px;word-break:break-all}
.empty{border:1.6px dashed rgba(8,90,108,.28);border-radius:16px;padding:26px 16px;text-align:center;color:#40626d;background:rgba(255,255,255,.45)}
/* waveform loading */
.wave{display:none;align-items:flex-end;gap:2.5px;height:16px}
.wave i{display:block;width:3.5px;background:#fff;border-radius:2px;animation:wv 0.9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{height:5px}50%{height:16px}}
.btn.loading .wave{display:inline-flex}.btn.loading .btn-label{opacity:.85}
body.locked{overflow:hidden}
/* bottom sheet */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:none}
.sheet-wrap.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(2,25,32,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:#f4fbfc;border-radius:24px 24px 0 0;padding:20px 18px 28px;color:#07303c;max-height:82vh;overflow:auto}
.sheet h3{font-size:16px;font-weight:800;margin-bottom:12px}
.opt{width:100%;text-align:left;padding:14px;border-radius:14px;border:1.5px solid rgba(8,90,108,.18);background:#fff;margin-bottom:9px;cursor:pointer;font-family:inherit}
.opt b{display:block;font-size:14px;color:#07303c}.opt span{font-size:12.5px;color:#527884}
.opt.sel{border-color:#0b9db8;background:rgba(12,170,195,.08)}
/* notices */
#notice{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;width:min(520px,calc(100% - 28px));display:none;padding:13px 16px;border-radius:15px;font-size:13.5px;font-weight:600;box-shadow:0 14px 34px rgba(0,20,28,.35)}
#notice.show{display:block}#notice.ok{background:#e6f7ee;color:#0a5c36;border:1px solid #7fd6a8}#notice.err{background:#fdecea;color:#8c1d18;border:1px solid #f0a49e}#notice.info{background:#e8f7fb;color:#075a6d;border:1px solid #8fd4e4}
#donePop{position:fixed;inset:0;z-index:210;display:none;place-items:center;background:rgba(2,25,32,.5)}
#donePop.show{display:grid}
#donePop .box{background:#fff;color:#07303c;border-radius:22px;padding:26px 22px;width:min(400px,calc(100% - 40px));text-align:center}
.logbox{background:#04222b;color:#bfeef7;border-radius:13px;padding:11px 13px;font-size:11.5px;max-height:130px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-top:10px;display:none}
@media(max-width:720px){.actions{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.layout{padding:10px 10px 24px}.main{padding:16px 13px 24px}}
/* recap workflow: pinned video + step pager */
.vid-pin{position:sticky;top:10px;z-index:40;background:rgba(250,254,255,.985);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 18px 38px rgba(0,45,58,.30)}
.vid-pin video.preview{max-height:34vh}
/* sequential step flow: labeled chips + Back/Next (no dots, no swipe pager) */
.steps-bar{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
.step-chip{flex:1 1 30%;display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:13px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);color:#eafcff;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-align:left}
.step-chip .n{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.step-chip.cur{background:#fff;color:#07303c;border-color:#fff}
.step-chip.cur .n{background:#0b9db8;color:#fff}
.step-chip.done .n{background:#2fbf71;color:#fff}
.step-chip.locked{opacity:.45}
.stepfoot{display:flex;align-items:center;gap:10px;margin-top:2px}
.stepfoot .btn{flex:1}
.stepfoot-name{font-size:12px;color:rgba(230,252,255,.85);font-weight:700;text-align:center;min-width:70px}
.panel{display:none}
.panel.active{display:block}
/* live subtitle overlay on the pinned video frame */
.vid-wrap{position:relative}
.sub-overlay{position:absolute;left:4%;right:4%;bottom:9%;text-align:center;font-family:'Padauk','Noto Sans Myanmar',sans-serif;font-weight:700;font-size:clamp(15px,4.4vw,25px);line-height:1.55;color:#fff;text-shadow:0 0 7px rgba(0,0,0,.95),0 2px 4px rgba(0,0,0,.95),-1px 0 0 rgba(0,0,0,.85),1px 0 0 rgba(0,0,0,.85),0 -1px 0 rgba(0,0,0,.85);pointer-events:none;display:none;white-space:pre-line;z-index:5}
/* SRT cue editor rows */
.cue-row{display:flex;gap:6px;align-items:flex-start;padding:8px;border:1.5px solid rgba(8,90,108,.16);border-radius:12px;margin-bottom:8px;background:#fff}
.cue-row.cur{border-color:#0b9db8;background:rgba(12,170,195,.08)}
.cue-row input[type=number]{width:66px;padding:7px 6px;border-radius:9px;border:1.5px solid rgba(8,90,108,.25);font-family:inherit;font-size:12.5px;color:#07303c}
.cue-row textarea{flex:1;padding:7px 9px;border-radius:9px;border:1.5px solid rgba(8,90,108,.25);font-family:inherit;font-size:13px;line-height:1.55;resize:vertical;min-height:36px;color:#07303c;background:#fff}
.cue-times{display:flex;flex-direction:column;gap:4px}
.cue-times label{font-size:9.5px;color:#6b8b94;font-weight:700}
.cue-ic{width:32px;height:32px;flex:0 0 32px;border-radius:9px;border:none;background:rgba(12,170,195,.14);color:#086a7d;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.cue-ic.del{background:#fdecea;color:#b3261e}
.warnbox{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fdf3e3;color:#8a5a00;font-size:13px;font-weight:600;line-height:1.55}
/* voice mini player */
.vp-row{display:flex;align-items:center;gap:10px}
.vp-play{width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:none;background:#06333f;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vp-track{flex:1;height:6px;border-radius:99px;background:rgba(8,90,108,.18);overflow:hidden}
.vp-bar{height:100%;width:0%;background:#0b9db8;border-radius:99px;transition:width .2s linear}
.vp-time{font-size:12px;color:#527884;font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<div class="layout"><main class="main">
<div class="brand"><div class="logo-badge">🎬</div><div><h1>Recaps</h1><small>recaps-free.work.gd</small></div></div>

<!-- Recap editor — the app's single feature; content injected by JS -->
<section class="tabpage active" id="page-recap"></section>
</main></div>


<div class="sheet-wrap" id="sheetWrap"><div class="sheet-bg" id="sheetBg"></div><div class="sheet"><h3 id="sheetTitle"></h3><div id="sheetBody"></div></div></div>
<div id="notice"></div>
<div id="donePop"><div class="box"><div style="font-size:34px">✅</div><h3 style="margin:8px 0" id="doneTitle">ရပါပြီ</h3><p id="doneText" style="font-size:13.5px;color:#527884"></p><button class="btn primary" id="doneOk" style="margin-top:14px">ဟုတ်ကဲ့</button></div></div>
<input type="file" id="globalFile" accept="video/*" style="display:none">
<script>
'use strict';
/* ================= Recaps Stage 1 — 100% client-side =================
   FFmpeg core (single-thread, no COOP/COEP needed):
   https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.js
   https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.wasm
   FFmpeg UMD: https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js
   Util UMD:   https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js  */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const FF_CORE='https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.js';
const FF_WASM='https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.wasm';
const ASPECTS={blurpad:{label:'9:16 — 1:1 ပုံ + Blur နောက်ခံ',desc:'ပုံ အလယ် 1:1၊ အပေါ်/အောက် blur၊ စာတန်း ပုံအောက်တွင်'},full916:{label:'9:16 — အပြည့် ဖြတ်',desc:'9:16 အပြည့် crop'},original:{label:'မူရင်း Aspect',desc:'မူရင်း အချိုးအတိုင်း'}};
const VOICES=['Kore','Puck','Charon','Leda','Aoede'];
const DEF={aspect:'blurpad',blur:28,voice:'Kore'};
function loadSettings(){try{return Object.assign({},DEF,JSON.parse(localStorage.getItem('recaps_settings')||'{}'))}catch(e){return Object.assign({},DEF)}}
let SETTINGS=loadSettings();
function saveSettings(){localStorage.setItem('recaps_settings',JSON.stringify(SETTINGS))}
function getApiKey(){return (localStorage.getItem('recaps_gemini_key')||'').trim()}
function fmtSize(b){if(!b&&b!==0)return'—';if(b<1048576)return(b/1024).toFixed(0)+' KB';if(b<1073741824)return(b/1048576).toFixed(1)+' MB';return(b/1073741824).toFixed(2)+' GB'}
function fmtDur(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
/* notices */
let noticeTimer=null;
function showNotice(msg,type){const n=$('#notice');n.textContent=msg;n.className='show '+(type||'info');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{n.className=''},5200)}
function showDone(title,text){$('#doneTitle').textContent=title;$('#doneText').textContent=text;$('#donePop').classList.add('show')}
$('#doneOk').addEventListener('click',()=>$('#donePop').classList.remove('show'));
/* bottom sheet */
function openSheet(title,html){$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=html;$('#sheetWrap').classList.add('open');document.body.classList.add('locked')}
function closeSheet(){$('#sheetWrap').classList.remove('open');document.body.classList.remove('locked')}
$('#sheetBg').addEventListener('click',closeSheet);
/* IndexedDB library — resilient: the connection can enter a "closing" state
   (seen live after heavy ffmpeg.wasm exports), so reopen + retry instead of
   caching one connection forever. */
let _db=null,_dbOpening=null;
function openDB(){
 if(_db)return Promise.resolve(_db);
 if(_dbOpening)return _dbOpening;
 _dbOpening=new Promise((res,rej)=>{const r=indexedDB.open('RecapsDB',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('videos',{keyPath:'id',autoIncrement:true})};
  r.onsuccess=()=>{_db=r.result;_dbOpening=null;_db.onclose=()=>{_db=null};_db.onversionchange=()=>{try{_db.close()}catch(e){}_db=null};res(_db)};
  r.onerror=()=>{_dbOpening=null;rej(r.error)}});
 return _dbOpening}
async function idbTx(mode,fn){let lastErr=null;for(let a=0;a<3;a++){const db=await openDB();try{return await new Promise((res,rej)=>{const tx=db.transaction('videos',mode);const out={};fn(tx.objectStore('videos'),out);tx.oncomplete=()=>res(out.val);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('transaction aborted'))})}catch(e){lastErr=e;if(/closing|InvalidStateError/i.test((e.name||'')+' '+(e.message||''))){_db=null;continue}throw e}}throw lastErr}
async function idbAdd(item){return idbTx('readwrite',(s,o)=>{const q=s.add(item);q.onsuccess=()=>{o.val=q.result}})}
function pickAspect(current,cb){openSheet('Aspect ရွေးပါ',Object.keys(ASPECTS).map(k=>'<button class="opt'+(k===current?' sel':'')+'" data-v="'+k+'"><b>'+ASPECTS[k].label+'</b><span>'+ASPECTS[k].desc+'</span></button>').join(''));$$('#sheetBody .opt').forEach(o=>o.onclick=()=>{closeSheet();cb(o.dataset.v)})}
function pickVoice(current,cb){openSheet('အသံ ရွေးပါ',VOICES.map(v=>'<button class="opt'+(v===current?' sel':'')+'" data-v="'+v+'"><b>'+v+'</b><span>Gemini TTS အသံ</span></button>').join(''));$$('#sheetBody .opt').forEach(o=>o.onclick=()=>{closeSheet();cb(o.dataset.v)})}
</script>
<script>
/* ================= Recap editor ================= */
function editorHTML(p){
const head='<h2 class="page-title">Recap လုပ်ရန်</h2><p class="page-sub">ဖုန်းထဲက video တင်ပြီး အဆင့်လိုက် Recap ထုတ်ပါ</p>';
const videoInner='<input type="file" id="'+p+'-file" accept="video/*" style="display:none"><button class="btn primary" id="'+p+'-pick">📱 Video ရွေးရန်</button><div class="file-info" id="'+p+'-fileinfo">ဖိုင် မရွေးရသေးပါ</div><div class="vid-wrap"><video class="preview" id="'+p+'-video" controls playsinline style="display:none;margin-top:10px"></video><div class="sub-overlay" id="'+p+'-overlay"></div></div>';
const trimInner='<div class="row2"><div class="field" id="'+p+'-f-start"><label>စချိန် (စက္ကန့်)</label><input type="number" id="'+p+'-start" value="0" min="0" step="0.1"><div class="err-text" id="'+p+'-e-start"></div></div><div class="field" id="'+p+'-f-end"><label>ဆုံးချိန် (စက္ကန့်)</label><input type="number" id="'+p+'-end" value="0" min="0" step="0.1"><div class="err-text" id="'+p+'-e-end"></div></div></div>'
+'<div class="field"><label>စချိန် slider</label><input type="range" id="'+p+'-rstart" value="0" min="0" max="100" step="0.1"></div><div class="field"><label>ဆုံးချိန် slider</label><input type="range" id="'+p+'-rend" value="0" min="0" max="100" step="0.1"></div><p class="hint" style="font-size:12px;color:#527884">ကြာချိန်: <b id="'+p+'-durinfo">—</b></p>';
const aspectInner='<div class="field"><label>Aspect</label><button class="btn light" id="'+p+'-aspectBtn" style="width:100%"></button></div><div class="field"><label>Blur အား — <span id="'+p+'-blurVal"></span></label><input type="range" id="'+p+'-blur" min="5" max="60" step="1"><p class="hint">Blur pad သုံးသော ပုံစံတွင်သာ သက်ရောက်ပါတယ်</p></div>'

   '<button class="opt'+(ed.aiMode==='faithful'?' sel':'')+'" data-v="faithful"><b>🎧 မူရင်း အသံအတိုင်း</b><span>မူရင်း အသံကို မြန်မာ စကားပြော ပုံစံဖြင့် တစ်ကြောင်းချင်း ဘာသာပြန်မယ်</span></button>'
  +'<button class="opt'+(ed.aiMode==='scene'?' sel':'')+'" data-v="scene"><b>✨ New Recaps Style</b><span>Scene ပုံများနှင့် စာသားကို ကြည့်ပြီး hook ပါသော ဇာတ်ကြောင်း အသစ် ရေးပေးမယ်</span></button>'
  +'<button class="btn primary" id="recap-createGo" style="margin-top:4px"><span class="btn-label">✨ Create</span></button>');
  let picked=ed.aiMode;
  $$('#sheetBody .opt').forEach(o=>o.onclick=()=>{picked=o.dataset.v;$$('#sheetBody .opt').forEach(x=>x.classList.toggle('sel',x===o))});
  const go=$('#recap-createGo');if(go)go.onclick=()=>{ed.aiMode=picked;closeSheet();runCreate()};
 }
 E('createRecap').onclick=openModeSheet;
 const recreateBtn=E('recreate');if(recreateBtn)recreateBtn.onclick=openModeSheet;
 const scriptTgl=E('scriptTgl');if(scriptTgl)scriptTgl.onclick=()=>{const b=E('scriptBody');const hidden=b.style.display==='none';b.style.display=hidden?'':'none';scriptTgl.textContent=hidden?'ဖျောက်':'ပြ'};
 const txTgl=E('aiTxTgl');if(txTgl)txTgl.onclick=()=>{const f=E('f-transcript');const hidden=f.style.display==='none';f.style.display=hidden?'':'none';txTgl.textContent=hidden?'ဖျောက်':'ပြ'};
 /* ================= step 4: voiceover (gated on script, engine choice, cache + mini player) ================= */
 function effVoice(){return ed.ttsEngine==='edge'?ed.edgeVoice:ed.voice}
 function voiceFresh(){const c=ed.voiceCache;return !!(c&&c.text===scriptText()&&c.engine===ed.ttsEngine&&c.voice===effVoice())}
 function checkVoiceStale(){
  const has=!!ed.voiceCache,fresh=voiceFresh();
  const st=E('voiceStale');if(st)st.style.display=(has&&!fresh)?'block':'none';
  if(has&&fresh)doneStep(2);else if(has)undoneStep(2);
 }
 function refreshVoiceGate(){if(ed.voiceBusy)return;const b=E('voiceGen');if(b)b.disabled=!scriptText()}
 function refreshEngineBtn(){const b=E('engineBtn');if(b)b.textContent=ed.ttsEngine==='edge'?'🌐 Edge TTS (key မလို)':'✨ Gemini TTS (ကိုယ့် key)'}
 E('engineBtn').onclick=()=>{
  openSheet('TTS Engine ရွေးပါ',
   '<button class="opt'+(ed.ttsEngine==='gemini'?' sel':'')+'" data-v="gemini"><b>✨ Gemini TTS</b><span>သင့် Gemini key သုံးမည် — အသံ: Kore / Puck / Charon / Leda / Aoede</span></button>'
  +'<button class="opt'+(ed.ttsEngine==='edge'?' sel':'')+'" data-v="edge"><b>🌐 Edge TTS</b><span>Key မလိုပါ — server မှတဆင့် အလုပ်လုပ်ပါတယ် (ပထမ အကြိမ် ~၁ မိနစ် ကြာနိုင်ပါတယ်) — မြန်မာ အသံ: Thiha / Nilar</span></button>');
  $$('#sheetBody .opt').forEach(o=>o.onclick=()=>{ed.ttsEngine=o.dataset.v;closeSheet();refreshEngineBtn();if(ed.refresh)ed.refresh();checkVoiceStale();showNotice('✅ Engine ပြောင်းပါပြီ: '+(ed.ttsEngine==='edge'?'Edge TTS':'Gemini TTS'),'ok')});
 };
 async function runVoiceGen(){
  if(ed.voiceBusy)return;
  const txt=scriptText();
  if(!txt){showNotice('⚠️ အသံ ထုတ်ရန် မြန်မာ Script အရင် လိုပါတယ် — အဆင့် ၁ မှာ "🎬 Recaps လုပ်မယ်" နှိပ်ပြီး Script အရင် ထုတ်ပါ','err');goStep(0);return}
  if(ed.ttsEngine==='gemini'&&!getApiKey()){showNotice('⚠️ Gemini TTS အတွက် Gemini API Key လိုပါတယ် — အပေါ်က "🔑 Gemini Key" ကတ်မှာ သင့် key ထည့်ပါ (Edge TTS ဆိုရင် key မလိုပါ)','err');const ki=$('#recap-apiKey');ki.focus();ki.scrollIntoView({behavior:'smooth',block:'center'});return}
  ed.voiceBusy=true;const btn=E('voiceGen');busyBtn(btn,true,'အသံ ထုတ်နေပါတယ်…');
  setVoiceStatus('🎙️ အသံ ထုတ်နေပါတယ်…');showNotice('▶️ အသံ ထုတ်ခြင်း စတင်ပါပြီ','info');
  try{
   const gv=await generateVoice(ed,txt,setVoiceStatus);
   ed.voiceCache={text:txt,engine:ed.ttsEngine,voice:effVoice(),bytes:gv.bytes,ext:gv.ext,genSpeed:parseFloat(E('genSpeed').value)||1,dur:0};
   ed._effVoice=null;ed.renderUrl=null;
   ed.adjSpeed=1;const asEl=E('adjSpeed');if(asEl){asEl.value=1;E('adjSpeedVal').textContent='1.00×'}
   if(ed.voiceUrl)URL.revokeObjectURL(ed.voiceUrl);
   ed.voiceUrl=URL.createObjectURL(new Blob([gv.bytes],{type:gv.ext==='mp3'?'audio/mpeg':'audio/wav'}));
   const au=E('vpAudio');au.src=ed.voiceUrl;au.playbackRate=effSpeedOf(ed);
   E('voicePlayer').style.display='block';
   const adj=E('adjWrap');if(adj)adj.style.display='block';
   setVoiceStatus('🎙️ အသံ ရပါပြီ — ကြာချိန် တိုင်းနေပါတယ်…');
   ed.voiceCache.dur=await probeAudioDur(gv.bytes,gv.ext);
   updateVoiceWarn();
   const vi=voiceDurInfo();
   setVoiceStatus('✅ အသံ ရပါပြီ — နားထောင်ကြည့်ပါ။'+(vi?' အသံ ~'+vi.effDur.toFixed(1)+' စက္ကန့် / video အပိုင်း '+vi.seg.toFixed(1)+' စက္ကန့် (အမြန် '+fmtSpeed(vi.eff)+')။':'')+' Export မှာ ဒီ အသံကို ပြန်သုံးပါမယ်');
   showNotice('✅ အသံ ရပါပြီ','ok');
  }catch(err){console.error(err);let m=err.message||String(err);if(ed.ttsEngine==='edge')m+=' — Edge TTS မရရင် Engine ကို Gemini သို့ ပြောင်းသုံးကြည့်ပါ';setVoiceStatus('❌ '+m);showNotice('❌ အသံ ထုတ်မရပါ: '+m,'err')}
  finally{ed.voiceBusy=false;busyBtn(btn,false,'🎙️ Create Voice');refreshVoiceGate();checkVoiceStale()}
 }
 E('voiceGen').onclick=runVoiceGen;
 /* mini player (custom controls over a hidden <audio>) */
 const au=E('vpAudio'),vpPlay=E('vpPlay'),vpBar=E('vpBar'),vpTime=E('vpTime');
 if(au&&vpPlay){
  vpPlay.onclick=()=>{if(!au.src)return;if(au.paused)au.play().catch(()=>{});else au.pause()};
  au.addEventListener('play',()=>{vpPlay.textContent='⏸️'});
  au.addEventListener('pause',()=>{vpPlay.textContent='▶️'});
  au.addEventListener('ended',()=>{vpPlay.textContent='▶️'});
  const vpDiv=()=>pvUseRendered()?1:Math.max(0.05,effSpeedOf(ed));
  au.addEventListener('loadedmetadata',()=>{vpTime.textContent='0:00 / '+fmtDur((au.duration||0)/vpDiv())});
  au.addEventListener('timeupdate',()=>{const d=au.duration||0,c=au.currentTime||0,div=vpDiv();vpBar.style.width=(d?Math.round(c/d*100):0)+'%';vpTime.textContent=fmtDur(c/div)+' / '+(d?fmtDur(d/div):'—')});
 }
 /* ================= step 5: speed controls, duration warning, render, insert ================= */
 function fmtSpeed(x){return (Math.round(x*100)/100).toFixed(2)+'×'}
 function voiceDurInfo(){
  const c=ed.voiceCache;if(!c||!c.dur)return null;
  const eff=effSpeedOf(ed),r=trimRange(),seg=Math.max(0,r.end-r.start);
  return{eff:eff,effDur:c.dur/eff,seg:seg,over:seg>0&&(c.dur/eff)>seg+0.05,need:seg>0?c.dur/seg:0};
 }
 function updateVoiceWarn(){
  const info=voiceDurInfo();
  const txt=(info&&info.over)?('⚠️ အသံ ('+info.effDur.toFixed(1)+' စက္ကန့်) က video အပိုင်း ('+info.seg.toFixed(1)+' စက္ကန့်) ထက် ရှည်နေပါတယ် — အသံ အမြန် စုစုပေါင်း '+info.need.toFixed(2)+'× အထိ တင်ပါ၊ သို့မဟုတ် အဆင့် ၁ မှာ Trim အပိုင်းကို ရှည်ပေးပါ။'):'';
  ['voiceWarn','cueWarn'].forEach(id=>{const w=E(id);if(w){w.style.display=txt?'block':'none';w.textContent=txt}});
  const ei=E('effInfo');
  if(ei)ei.textContent=info?('အသံ ကြာချိန် ~'+info.effDur.toFixed(1)+' စက္ကန့် (စုစုပေါင်း အမြန် '+fmtSpeed(info.eff)+') · video အပိုင်း '+info.seg.toFixed(1)+' စက္ကန့်'):'';
 }
 function syncVoicePlayer(){
  const a=E('vpAudio');if(!a)return;
  const rendered=pvUseRendered();
  const want=rendered?ed.renderUrl:ed.voiceUrl;
  if(want&&a.src!==want)a.src=want;
  a.playbackRate=rendered?1:Math.max(0.05,effSpeedOf(ed));
 }
 E('genSpeed').addEventListener('input',()=>{E('genSpeedVal').textContent=fmtSpeed(parseFloat(E('genSpeed').value)||1)});
 E('adjSpeed').addEventListener('input',()=>{
  ed.adjSpeed=parseFloat(E('adjSpeed').value)||1;
  E('adjSpeedVal').textContent=fmtSpeed(ed.adjSpeed);
  syncVoicePlayer();updateVoiceWarn();
 });
 E('renderSpeed').onclick=async()=>{
  if(ed.renderBusy)return;
  if(!ed.voiceCache){showNotice('⚠️ အမြန် ပြင်ရန် အသံ အရင် ထုတ်ပါ','err');return}
  const eff=effSpeedOf(ed);
  if(Math.abs(eff-1)<0.001){showNotice('ℹ️ စုစုပေါင်း အမြန် 1.00× ပါ — ပြင်စရာ မလိုပါ','info');return}
  ed.renderBusy=true;const btn=E('renderSpeed');btn.classList.add('loading');btn.disabled=true;
  setVoiceStatus('🔄 အမြန် '+fmtSpeed(eff)+' ဖြင့် အသံ ပြန်ထုတ်နေပါတယ်…');showNotice('▶️ အသံ ပြန်ထုတ်ခြင်း စတင်ပါပြီ','info');
  try{
   const rv=await effectiveVoiceBytes(ed,ed.voiceCache.bytes,ed.voiceCache.ext,m=>setVoiceStatus(m));
   if(ed.renderUrl)URL.revokeObjectURL(ed.renderUrl);
   ed.renderUrl=URL.createObjectURL(new Blob([rv.bytes],{type:'audio/wav'}));
   syncVoicePlayer();updateVoiceWarn();
   setVoiceStatus('✅ အမြန် '+fmtSpeed(eff)+' ဖြင့် အသံ ပြန်ထုတ်ပြီးပါပြီ — player မှာ နားထောင်ကြည့်ပါ');
   showNotice('✅ အသံ ပြန်ထုတ်ပြီးပါပြီ','ok');
  }catch(err){console.error(err);setVoiceStatus('❌ '+(err.message||err));showNotice('❌ အသံ ပြန်ထုတ်မရပါ: '+(err.message||err),'err')}
  finally{ed.renderBusy=false;btn.classList.remove('loading');btn.disabled=false}
 };
 E('insertBtn').onclick=async()=>{
  if(ed.insertBusy)return;
  if(previewMode)exitPreview(true);
  const c=ed.voiceCache;
  if(!c){showNotice('⚠️ Video ထဲ ထည့်ရန် အသံ အရင် လိုပါတယ် — အရင် "🎙️ Create Voice" နှိပ်ပါ','err');return}
  if(!ed.file){showNotice('⚠️ Video ဖိုင် အရင် လိုပါတယ် — အဆင့် ၁ မှာ ရွေးပါ','err');goStep(0);return}
  const r=trimRange();
  if(!(r.end>r.start)){showNotice('⚠️ Trim အချိန် (စချိန်/ဆုံးချိန်) အရင် မှန်အောင် ထားပါ — အဆင့် ၁ မှာ ပြင်ပါ','err');goStep(0);return}
  if(!c.dur)c.dur=await probeAudioDur(c.bytes,c.ext);
  const info=voiceDurInfo();
  if(info&&info.over){updateVoiceWarn();const w=E('voiceWarn');if(w)w.scrollIntoView({behavior:'smooth',block:'center'});showNotice('⚠️ အသံ ('+info.effDur.toFixed(1)+' စက္ကန့်) က video အပိုင်း ('+info.seg.toFixed(1)+' စက္ကန့်) ထက် ရှည်နေပါတယ် — အသံကို ဖြတ်မပစ်ပါ။ အမြန် စုစုပေါင်း '+info.need.toFixed(2)+'× အထိ တင်ပြီးမှ ပြန်ထည့်ပါ','err');return}
  ed.insertBusy=true;const btn=E('insertBtn');busyBtn(btn,true,'ထည့်နေပါတယ်…');
  const st=E('insertStatus');st.textContent='🎬 အသံပါသော video ထုတ်နေပါတယ်…';showNotice('▶️ Video ထဲ အသံ ထည့်ခြင်း စတင်ပါပြီ','info');
  try{
   const rv=await effectiveVoiceBytes(ed,c.bytes,c.ext,m=>{st.textContent=m});
   const ff=await getFFmpeg(m=>{st.textContent=m});
   const fetchFile=window.FFmpegUtil&&window.FFmpegUtil.fetchFile;
   await ff.writeFile('ins_in.mp4',fetchFile?await fetchFile(ed.file):new Uint8Array(await ed.file.arrayBuffer()));
   const vf='ins_voice.'+rv.ext;await ff.writeFile(vf,rv.bytes);
   const seg=(r.end-r.start).toFixed(2);
   const code=await ff.exec(['-ss',r.start.toFixed(2),'-i','ins_in.mp4','-i',vf,'-t',seg,'-map','0:v:0','-map','1:a:0','-af','apad,atrim=0:'+seg,'-c:v','libx264','-preset','veryfast','-crf','23','-pix_fmt','yuv420p','-c:a','aac','-b:a','128k','-movflags','+faststart','ins_out.mp4'],3600000);
   if(code!==0)throw new Error('ffmpeg exit code '+code);
   const data=await ff.readFile('ins_out.mp4');
   const blob=new Blob([data.buffer||data],{type:'video/mp4'});
   try{await ff.deleteFile('ins_in.mp4')}catch(e){}try{await ff.deleteFile(vf)}catch(e){}
   if(ed.insertUrl)URL.revokeObjectURL(ed.insertUrl);
   ed.insertUrl=URL.createObjectURL(blob);
   vidEl.src=ed.insertUrl;vidEl.muted=false;
   const base=((ed.file.name||'recap').replace(/\.[^.]+$/,'').replace(/[^\w\- ]+/g,'').trim()||'recap');
   E('insertResult').innerHTML='<a class="btn light small" href="'+ed.insertUrl+'" download="'+base+'_voice.mp4">⬇️ အသံပါသော video ဒေါင်း</a> <button class="btn light small" id="'+p+'-restoreVid">↩ မူရင်း video ပြန်ပြ</button>';
   const rb=E('restoreVid');if(rb)rb.onclick=()=>{vidEl.src=ed.url;showNotice('↩ မူရင်း video ပြန်ပြထားပါတယ်','info')};
   st.textContent='✅ အသံ ထည့်ပြီးပါပြီ — အပေါ်က player မှာ စစ်ကြည့်ပါ၊ သို့မဟုတ် ဒေါင်းပါ';
   showDone('✅ ရပါပြီ','အသံပါသော video ထုတ်ပြီးပါပြီ — player မှာ စစ်ကြည့်နိုင်ပြီး ဒေါင်း link လည်း ရပါပြီ။');
  }catch(err){console.error(err);st.textContent='❌ '+(err.message||err);showNotice('❌ Video ထဲ ထည့်မရပါ: '+(err.message||err),'err')}
  finally{ed.insertBusy=false;busyBtn(btn,false,'🎬 Video ထဲ ထည့်မယ်')}
 };
 /* script edits drive the cue count, the stale warning and the voice gate */
 E('subs').addEventListener('input',()=>{updateCueCount();checkVoiceStale();refreshVoiceGate();renderSteps()});
 ['start','end'].forEach(id=>{E(id).addEventListener('input',()=>{updateVoiceWarn()})});
 refreshEngineBtn();updateCueCount();refreshVoiceGate();renderSteps();updateVoiceWarn();
})();
