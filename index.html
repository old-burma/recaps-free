<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recaps — Video Recap လုပ်ရန်</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Padauk:wght@400;700&family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
html,body{height:100%}
body{font-family:'Inter','Padauk','Noto Sans Myanmar',system-ui,sans-serif;color:#F2F2F5;background:#0B0B0F;height:100vh;height:100dvh;overflow:hidden}
/* V210 CapCut-style shell: the app fills the viewport and the PAGE never
   scrolls — preview / timeline / toolbar are fixed zones and only the
   bottom panel scrolls internally. V211: the transport is a GLASS bar
   overlaid on the preview frame's bottom edge (not a flow zone).
   V212: the top app bar is GONE — the preview zone is the first element
   and the layout takes the full viewport height. */
.layout{padding:0;max-width:980px;margin:0 auto;height:100vh;height:100dvh}
.main{padding:0;height:100%}
.tabpage{display:none}.tabpage.active{display:block}
#page-recap{display:flex;flex-direction:column;height:100%}
/* V212: no top app bar — only the sheet offset var remains (the sheet
   wrap starts at the preview frame's bottom edge, measured live) */
:root{--sheetTop:64px}
.icon-btn{width:38px;height:38px;flex:0 0 38px;border-radius:11px;border:1.5px solid #2C2C35;background:#1E1E24;font-size:16px;cursor:pointer;color:#F2F2F5;display:flex;align-items:center;justify-content:center;font-family:inherit}
.pill-btn{padding:8px 9px;border-radius:999px;border:1.5px solid #2C2C35;background:#1E1E24;font-family:inherit;font-size:12.5px;font-weight:700;color:#F2F2F5;cursor:pointer;white-space:nowrap}
.pill-btn:disabled{opacity:.55}
/* ===== cards / fields / buttons (dark surfaces) ===== */
.card{background:#17171C;border:1px solid #26262E;border-radius:20px;padding:18px;color:#F2F2F5;margin-bottom:14px}
.card h3{font-size:16px;font-weight:800;margin-bottom:6px;color:#F2F2F5}
.card h3.studio-h{color:#F5A623;font-size:17px}
.card p{font-size:13px;color:#9A9AA5;line-height:1.55}
.btn{padding:12px 18px;border-radius:999px;border:1.5px solid #2C2C35;cursor:pointer;background:#1E1E24;color:#F2F2F5;font-size:14px;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:linear-gradient(90deg,#F59E0B,#F97316);color:#fff;border:none;box-shadow:0 8px 18px rgba(245,130,20,.32);width:100%}
.btn.primary.outline{background:#1E1E24;color:#FBBF24;border:2px solid #F59E0B;box-shadow:none}
.btn.light{background:#1E1E24;color:#F2F2F5;border:1.5px solid #2C2C35}
.btn.green{background:linear-gradient(90deg,#25B373,#1F9D66);color:#fff;border:none;box-shadow:0 8px 18px rgba(31,157,102,.30)}
.btn.danger{background:#b3261e;color:#fff;border:none}
.btn.danger.armed{background:#e5484d;box-shadow:0 0 0 3px rgba(229,72,77,.35)}
.btn.small{padding:8px 13px;font-size:12.5px}
.btn:disabled{opacity:.55}
.btn.off{opacity:.45}
.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#E8E8ED}
.field input[type=text],.field input[type=number],.field input[type=password],.field textarea{width:100%;padding:11px 13px;border-radius:13px;border:1.5px solid #2C2C35;font-family:inherit;font-size:14px;background:#101014;color:#F2F2F5}
.field textarea{min-height:110px;line-height:1.7;resize:vertical}
.field .hint{font-size:11.5px;color:#8A8A95;margin-top:4px}
.hint{font-size:11.5px;color:#8A8A95;line-height:1.55}
.field.bad input,.field.bad textarea{border-color:#d32f2f;box-shadow:0 0 0 3px rgba(211,47,47,.18)}
.err-text{display:none;font-size:12.5px;color:#F28B82;font-weight:600;margin-top:5px}.err-text.show{display:block}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:#2C2C35;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#F97316);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(180,110,0,.45);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#F97316;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(180,110,0,.45);cursor:pointer}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:#2C2C35}
input[type=checkbox]{width:19px;height:19px;accent-color:#22A06B;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.picker-row{display:flex;gap:10px;flex-wrap:wrap}
.pick-btn{flex:1;padding:12px;border-radius:14px;border:1.5px solid #2C2C35;background:#1E1E24;cursor:pointer;font-family:inherit;text-align:left}
.pick-btn b{display:block;font-size:13.5px;color:#F2F2F5}.pick-btn span{font-size:12px;color:#9A9AA5}
.switch-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.tgl{width:50px;height:28px;border-radius:999px;background:#3A3A45;position:relative;cursor:pointer;flex:0 0 50px}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:all .18s}
.tgl.on{background:#F59E0B}.tgl.on::after{left:25px}
video.preview{width:100%;border-radius:12px;background:#000}
video.preview.framed{max-height:40vh;object-fit:contain}
.file-info{font-size:12.5px;color:#9A9AA5;margin-top:6px;word-break:break-all}
/* waveform loading */
.wave{display:none;align-items:flex-end;gap:2.5px;height:16px}
.wave i{display:block;width:3.5px;background:currentColor;border-radius:2px;animation:wv 0.9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{height:5px}50%{height:16px}}
.btn.loading .wave{display:inline-flex}.btn.loading .btn-label{opacity:.85}
.pill-btn.loading .wave{display:inline-flex}.pill-btn.loading .btn-label{opacity:.85}
body.locked{overflow:hidden}
/* bottom sheet — V213: the home of EVERY toolbar feature pop-up
   (Burmese Voice app style), plus the small pickers + the cue editor */
.sheet-wrap{position:fixed;left:0;right:0;bottom:0;top:var(--sheetTop,0px);z-index:100;display:none}
.sheet-wrap.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(5,5,8,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:#17171C;border-radius:24px 24px 0 0;padding:16px 18px 14px;color:#F2F2F5;max-height:min(68vh,100%);display:flex;flex-direction:column;overflow:hidden}
.sheet h3{font-size:16px;font-weight:800;margin:0}
/* V214: the close controls live in the sheet FRAME, not the content —
   a sticky header row (title + ✕) and a footer (✓ ပြီး) bracket the
   scrolling body, so EVERY sheet (features, pickers, cue pop-up, Key)
   always shows both, no matter which home is mounted inside */
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;margin-bottom:12px}
.sheet-x{flex:none;width:42px;height:42px;border-radius:50%;border:1.5px solid #2C2C35;background:#1B1B21;color:#F2F2F5;font-size:16px;line-height:1;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0}
.sheet-x:active{background:#26262E}
#sheetBody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-foot{flex:none;padding-top:12px}
.sheet-foot .btn{width:100%}
/* V213: EVERY feature pop-up (the Burmese Voice app pattern) shares the
   same cap — the wrap starts below the preview frame, so 100% of the
   wrap height is the hard limit and the video stays visible above */
.sheet-wrap.voicePop .sheet{max-height:min(68vh,100%)}
.opt{width:100%;text-align:left;padding:14px;border-radius:14px;border:1.5px solid #2C2C35;background:#1B1B21;margin-bottom:9px;cursor:pointer;font-family:inherit;color:#F2F2F5}
.opt b{display:block;font-size:14px;color:#F2F2F5}.opt span{font-size:12.5px;color:#9A9AA5}
.opt.sel{border-color:#F59E0B;background:rgba(245,158,11,.14)}
.opt.dim{opacity:.45;cursor:not-allowed}.opt.dim b{color:#9A9AA5}
/* notices */
#notice{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;width:min(520px,calc(100% - 28px));display:none;padding:13px 16px;border-radius:15px;font-size:13.5px;font-weight:600;box-shadow:0 14px 34px rgba(0,0,0,.5)}
#notice.show{display:block}#notice.ok{background:#e6f7ee;color:#0a5c36;border:1px solid #7fd6a8}#notice.err{background:#fdecea;color:#8c1d18;border:1px solid #f0a49e}#notice.info{background:#FFF3CF;color:#7A5200;border:1px solid #F3CD72}
#donePop{position:fixed;inset:0;z-index:210;display:none;place-items:center;background:rgba(5,5,8,.55)}
#donePop.show{display:grid}
#donePop .box{background:#1E1E24;color:#F2F2F5;border:1px solid #2C2C35;border-radius:22px;padding:26px 22px;width:min(400px,calc(100% - 40px));text-align:center}
.logbox{background:#0A141C;color:#FFE1A8;border-radius:13px;padding:11px 13px;font-size:11.5px;max-height:130px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-top:10px;display:none}
.exp-prog{margin-top:12px;background:#101820;border:1px solid #223544;border-radius:13px;padding:12px 14px}
.exp-prog-head{display:flex;align-items:center;gap:10px}
.exp-prog .wave{display:inline-flex;color:#F59E0B}
.exp-pct{font-size:26px;font-weight:800;color:#FFD88A;line-height:1}
.exp-bar{height:8px;border-radius:5px;background:#22303C;margin-top:10px;overflow:hidden}
.exp-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#F59E0B,#F97316);border-radius:5px;transition:width .2s ease}
.exp-prev{width:100%;height:auto;max-height:46vh;object-fit:contain;background:#000;border:1px solid #223544;border-radius:13px;margin-top:10px;box-sizing:border-box}
.exp-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:12px;color:#9FB4C0}
.exp-meta .exp-elapsed{font-variant-numeric:tabular-nums;white-space:nowrap}
.exp-meta .exp-eta{white-space:nowrap;color:#FFD88A;font-variant-numeric:tabular-nums}
/* ===== preview zone (large, centred, top) + placeholder + overlays ===== */
.vid-sticky{flex:0 0 auto;background:#000;padding:8px 10px 6px}
.pick-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pick-row .file-info{margin-top:0}
.vid-wrap{position:relative;max-width:600px;margin:0 auto}
/* V216 WYSIWYG aspect stage: in a fixed-canvas mode the stage IS the
   export canvas (same ratio, same fit) — a blurred cover copy of the
   video fills the canvas (.preview-bg) and the sharp video sits inside
   with object-fit:contain (shown WHOLE, nothing cut). The 9:16 +
   landscape special case (.stg-square) moves the sharp video into the
   centred 1:1 region (top 21.875%, height 56.25% of the 9:16 stage =
   the export's picY 280/1280 and 720/1280 square), so the subtitle
   band below it sits in the blur pad exactly as exported. Original
   mode keeps the pre-V216 raw layout. Stage height was capped (~46vh)
   so the panel below kept room; V229: the Script panel left the main
   page (it is a toolbar sheet now), so the caps are raised to ~56vh
   of stage height and the stage takes the freed space; width follows
   from the ratio. */
.vid-wrap.stg-916,.vid-wrap.stg-169,.vid-wrap.stg-11{overflow:hidden;background:#000;border-radius:12px}
.vid-wrap.stg-916{aspect-ratio:9/16;width:min(600px,100%,31.5vh)}
.vid-wrap.stg-169{aspect-ratio:16/9;width:min(600px,100%,100vh)}
.vid-wrap.stg-11{aspect-ratio:1/1;width:min(600px,100%,56vh)}
.vid-wrap .preview-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.vid-wrap.stg-916 .preview,.vid-wrap.stg-169 .preview,.vid-wrap.stg-11 .preview{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:contain;border-radius:0;z-index:1}
.vid-wrap.stg-square .preview{top:21.875%;bottom:auto;height:56.25%}
.vid-wrap.stg-916 .ph-box,.vid-wrap.stg-169 .ph-box,.vid-wrap.stg-11 .ph-box{position:absolute;inset:0;aspect-ratio:auto;max-height:none;border-radius:0;z-index:2}
.ph-box{background:#0E2233;border-radius:12px;aspect-ratio:16/9;max-height:38vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.ph-ic{font-size:38px}
.ph-t{font-size:15px;font-weight:700;color:#E8F0F5}
.ph-s{font-size:12px;color:#8FA6B5}
.sub-overlay{position:absolute;left:4%;right:4%;bottom:9%;text-align:center;font-family:'Padauk','Noto Sans Myanmar',sans-serif;font-weight:700;font-size:clamp(15px,4.4vw,25px);line-height:1.55;color:#fff;text-shadow:0 0 7px rgba(0,0,0,.95),0 2px 4px rgba(0,0,0,.95),-1px 0 0 rgba(0,0,0,.85),1px 0 0 rgba(0,0,0,.85),0 -1px 0 rgba(0,0,0,.85);pointer-events:auto;cursor:grab;touch-action:none;display:none;white-space:pre-line;z-index:5}
.sub-overlay:active{cursor:grabbing}
.mode-pill{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(10,28,38,.72);color:#fff;font-size:12px;font-weight:700;padding:5px 14px;border-radius:999px;pointer-events:none;z-index:8;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;transition:opacity .45s ease}
.mode-pill.hide{opacity:0}
.title-overlay{position:absolute;top:max(46px,13%);left:5%;right:5%;text-align:center;font-weight:800;font-size:clamp(16px,5vw,30px);line-height:1.4;color:#FFE92E;text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.8);pointer-events:auto;cursor:grab;touch-action:none;display:none;z-index:4;font-family:'Padauk','Noto Sans Myanmar',sans-serif;white-space:pre-line;transform:translate(-50%,-50%);width:max-content;max-width:94%}
.title-overlay:active{cursor:grabbing}
.logo-overlay{position:absolute;top:12px;left:12px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.92);text-shadow:0 1px 4px rgba(0,0,0,.85);pointer-events:auto;cursor:grab;touch-action:none;display:none;z-index:4;align-items:center;gap:7px;transform:translate(-50%,-50%)}
.logo-overlay:active{cursor:grabbing}
.logo-overlay img{display:block;border-radius:50%}
.logo-overlay .logo-word{display:block;text-align:center;white-space:nowrap}
.text-overlay{position:absolute;transform:translate(-50%,-50%);font-weight:700;line-height:1.5;color:#fff;text-shadow:0 0 7px rgba(0,0,0,.95),0 2px 4px rgba(0,0,0,.95);pointer-events:auto;cursor:grab;touch-action:none;display:none;z-index:6;white-space:nowrap;width:max-content;max-width:none;text-align:center;font-family:'Padauk','Noto Sans Myanmar',sans-serif;padding:2px 8px}
.text-overlay:active{cursor:grabbing}
.frame-border{position:absolute;inset:0;border:3px solid #FFE92E;border-radius:14px;pointer-events:none;display:none;z-index:7}
/* ===== V217 Blur tool + colour swatches =====
   .blur-layer sits over the video (z 3, below the app's own overlays)
   and holds one region div per blur region. Region divs are inert
   (pointer-events:none) until the wrap gets .blur-editing (Blur sheet
   open): then they can be dragged / resized and the selected one shows
   its corner handle. The effect itself (backdrop-filter) is always
   live so the preview shows exactly what export will cover. */
.blur-layer{position:absolute;inset:0;z-index:3;pointer-events:none}
.blur-region{position:absolute;border-radius:4px;pointer-events:none;overflow:visible;touch-action:none}
.blur-region.fx-blur{-webkit-backdrop-filter:blur(20px) saturate(.9);backdrop-filter:blur(20px) saturate(.9)}
.blur-region.fx-mosaic{-webkit-backdrop-filter:blur(3px) saturate(.55) contrast(1.15);backdrop-filter:blur(3px) saturate(.55) contrast(1.15);background-image:repeating-conic-gradient(rgba(0,0,0,.20) 0% 25%,rgba(255,255,255,.12) 0% 50%)}
.vid-wrap.blur-editing .blur-region{pointer-events:auto;cursor:move;outline:1.5px dashed rgba(255,255,255,.6)}
.vid-wrap.blur-editing .blur-region.sel{outline:2px solid #F97316}
.blur-region .br-handle{position:absolute;right:-10px;bottom:-10px;width:22px;height:22px;border-radius:50%;background:#F97316;border:2px solid #fff;cursor:nwse-resize;display:none;z-index:2;touch-action:none}
.vid-wrap.blur-editing .blur-region.sel .br-handle{display:block}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:46px;height:36px;border-radius:11px;border:2px solid #2C2C35;cursor:pointer;padding:0}
.sw.sel{border-color:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.35)}
/* custom transport — V212: NO glass, NO button backgrounds. The icon
   row (▶/⏸ · ⏪ · times · ⏩) floats fully transparent over the frame —
   white glyphs with a soft drop shadow only — and the seek slider is a
   SEPARATE slim line on its own row at the frame's very bottom edge.
   Auto-hide while playing unchanged (see showTransport). */
.transport{position:absolute;left:0;right:0;bottom:0;z-index:9;display:flex;flex-direction:column;gap:2px;padding:2px 12px 7px;transition:opacity .35s ease}
.transport.hide{opacity:0;pointer-events:none}
.tp-row{display:flex;align-items:center;gap:15px}
.tp-play{background:none;border:none;color:#fff;font-size:21px;line-height:1;padding:3px 4px;cursor:pointer;font-family:inherit;text-shadow:0 1px 5px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9)}
.tp-skip{background:none;border:none;color:#fff;font-size:16px;line-height:1;padding:3px 4px;cursor:pointer;font-family:inherit;text-shadow:0 1px 5px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9)}
.tp-time{font-size:11.5px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.tp-right{margin-left:auto}
.tp-seek{width:100%;height:3px;background:rgba(255,255,255,.35)}
.tp-seek::-webkit-slider-thumb{width:13px;height:13px;border-width:2px}
.tp-seek::-moz-range-thumb{width:12px;height:12px;border-width:2px}
.tp-seek::-moz-range-track{height:3px;background:rgba(255,255,255,.35)}
/* ===== timeline — V213: TWO tracks only (subtitle cues + voice) ===== */
.tl-wrap{flex:0 0 auto;background:#101014;border-top:1px solid #26262E;border-bottom:1px solid #26262E;padding:2px 0 2px}
.tl-scroll{overflow-x:auto;overflow-y:hidden}
.tl-inner{position:relative;min-width:100%}
.tl-track{position:relative;height:15px}
.tl-track-subs{height:18px}
.tl-block{position:absolute;top:2px;border-radius:4px;font-size:9.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;font-family:inherit;text-align:left}
.tl-sblock{height:14px;line-height:14px;padding:0 5px;background:rgba(245,158,11,.22);border:1px solid #B97A0E;color:#FFD9A0}
.tl-sblock.cur{background:#F59E0B;border-color:#F59E0B;color:#1A1206;font-weight:700}
.tl-voblock{height:12px;line-height:12px;padding:0 6px;background:#1F3D2B;border:1px solid #25B373;color:#A7E8C6}
.tl-voblock.stale{background:repeating-linear-gradient(45deg,#3A2329,#3A2329 6px,#2A1A1F 6px,#2A1A1F 12px);border-color:#8A4B52;color:#F0A49E}
.tl-playhead{position:absolute;top:0;bottom:0;width:2px;background:#F97316;box-shadow:0 0 6px rgba(249,115,22,.8);z-index:4;pointer-events:none}
/* ===== V222: time ruler + video waveform rows (above the cue track) ===== */
.tl-ruler-row{position:relative;height:9px}
.tl-ruler-row canvas{display:block}
.tl-wave-row{position:relative;height:12px;border-bottom:1px solid #1D1D24;margin-bottom:0}
.tl-wave-row canvas{display:block}
.tl-wave-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;color:#9A9AA5;pointer-events:none;letter-spacing:.02em}
/* ===== studio deck (HOME panel content) ===== */
.studio-status{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#C9C9D2;margin:2px 0 14px}
.studio-status .dot{width:9px;height:9px;border-radius:50%;background:#22C55E;flex:0 0 9px;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.chip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:420px){.chip-grid{grid-template-columns:repeat(2,1fr)}}
.style-chip,.voice-chip{padding:12px 8px;border-radius:14px;border:1.5px solid #2C2C35;background:#1B1B21;font-family:inherit;font-size:13.5px;font-weight:700;color:#C9C9D2;cursor:pointer;text-align:center}
.style-chip.sel,.voice-chip.sel{border-color:#F59E0B;background:rgba(245,158,11,.14);color:#FBBF24}
.voice-labelrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.voice-labelrow>label{font-size:13px;font-weight:700;color:#E8E8ED;margin-bottom:0}
.field .duck-chk{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#34D399;cursor:pointer;margin-bottom:0}
.btn-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn-row2 .btn{width:100%;padding:9px 10px;font-size:13px;white-space:nowrap}
/* SRT cue list rows — V213: summary rows; tap one to edit it in the
   per-cue pop-up (text / start / end / save / delete live there) */
.cue-row{display:flex;gap:8px;align-items:center;padding:8px;border:1.5px solid #2C2C35;border-radius:12px;margin-bottom:8px;background:#1B1B21}
.cue-row.cur{border-color:#F59E0B;background:rgba(245,158,11,.12)}
.cue-row .cue-del{flex:none;margin-left:auto;background:rgba(229,57,53,.14);border:1.5px solid rgba(229,57,53,.55);color:#FF8A80;border-radius:10px;padding:7px 11px;font-size:15px;line-height:1;cursor:pointer;font-family:inherit}
.cue-row .cue-del:active{background:rgba(229,57,53,.32)}
.cue-main{flex:1;min-width:0;cursor:pointer}
.cue-txt{display:block;font-size:13px;line-height:1.5;color:#F2F2F5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cue-when{display:block;font-size:11px;color:#9A9AA5;margin-top:1px}
.cue-ic{width:32px;height:32px;flex:0 0 32px;border-radius:9px;border:none;background:rgba(245,158,11,.16);color:#FBBF24;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.cue-pop textarea{min-height:64px}
.warnbox{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(245,158,11,.12);color:#FBBF24;font-size:13px;font-weight:600;line-height:1.55}
/* voice mini player */
.vp-row{display:flex;align-items:center;gap:10px}
.vp-play{width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:none;background:linear-gradient(135deg,#F59E0B,#F97316);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vp-track{flex:1;height:6px;border-radius:99px;background:#2C2C35;overflow:hidden}
.vp-bar{height:100%;width:0%;background:#F59E0B;border-radius:99px;transition:width .2s linear}
.vp-time{font-size:12px;color:#9A9AA5;font-weight:600;white-space:nowrap}
/* ===== V210 status strip (under the preview frame) ===== */
.status-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:11px;font-weight:700;color:#9A9AA5;max-width:600px;margin-left:auto;margin-right:auto}
.status-strip span{background:#17171C;border:1px solid #26262E;border-radius:999px;padding:2px 8px;white-space:nowrap}
.status-strip span b{color:#34D399}
/* V212: the Export segment IS the export button — same pill look as the
   other segments, an inviting orange pill once export-ready */
.status-strip .strip-btn{font:inherit;color:inherit;background:#17171C;border:1px solid #26262E;border-radius:999px;padding:2px 8px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.status-strip .strip-btn b{color:#34D399}
.status-strip .strip-btn.ready{background:linear-gradient(90deg,#F59E0B,#F97316);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(245,130,20,.35)}
.status-strip .strip-btn.ready b{color:#fff}
.status-strip .strip-btn:disabled{opacity:.55}
.strip-btn.loading .wave{display:inline-flex}
.deck-sec{margin-top:14px}
.deck-sec:first-child{margin-top:2px}
.deck-ttl{font-size:13.5px;font-weight:800;color:#F2F2F5;margin-bottom:8px}
.mode-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-btn{padding:8px 8px;border-radius:13px;border:1.5px solid #2C2C35;background:#1B1B21;font-family:inherit;cursor:pointer;text-align:center;width:100%}
.mode-btn b{display:block;font-size:13.5px;color:#F2F2F5}
.mode-btn span{display:block;font-size:10.5px;color:#9A9AA5;margin-top:1px;font-weight:600}
.mode-btn.sel{border-color:#F59E0B;background:rgba(245,158,11,.14)}
.mode-btn.sel b{color:#FBBF24}
.mode-btn:disabled{opacity:.55;cursor:default}
.style-row{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:9px;padding:2px 2px 4px;-webkit-overflow-scrolling:touch}
.style-row::-webkit-scrollbar{display:none}
.style-row .style-chip{padding:6px 9px;border-radius:999px;font-size:12px;flex:0 0 auto}
/* ===== V211 horizontal scroll rows (chips / pickers / options) ===== */
.scroll-row{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;-webkit-overflow-scrolling:touch}
.scroll-row::-webkit-scrollbar{display:none}
.scroll-row>*{flex:0 0 auto}
.voice-row .voice-chip{padding:9px 13px;border-radius:999px;font-size:12.5px}
.picker-pill{padding:9px 13px;font-size:12.5px;white-space:nowrap}
/* ===== V215 Voice Create — Burmese Voice app sheet layout =====
   ONE big select-style voice field; sliders as label+value header over
   a fat track with a large round thumb; a စမ်းသပ်/Reset action row; and
   a BIG pale full-width generate button (dark text, dark wave bars via
   currentColor while busy). Colours stay the Recaps dark/orange theme. */
.voice-field{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;border-radius:14px;border:1.5px solid #2C2C35;background:#1C1C22;color:#F2F2F5;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-align:left}
.voice-field:active{background:#23232B}
.vf-caret{color:#9A9AA5;font-size:14px;flex:0 0 auto}
.vs-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.vs-head label{font-size:13.5px;font-weight:700;color:#E8E8ED}
.vs-val{font-size:19px;font-weight:800;color:#fff;white-space:nowrap}
input[type=range].vs-range{height:9px}
input[type=range].vs-range::-webkit-slider-thumb{width:27px;height:27px}
input[type=range].vs-range::-moz-range-thumb{width:25px;height:25px}
input[type=range].vs-range::-moz-range-track{height:9px}
.voice-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 12px}
.btn.voice-gen{background:linear-gradient(180deg,#F5F5F7,#E4E4EA);color:#141419;border:none;border-radius:16px;min-height:56px;font-size:16.5px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.btn.voice-gen:disabled{opacity:.55;box-shadow:none}
.vpick-sec{font-size:12.5px;font-weight:800;color:#9A9AA5;margin:14px 2px 8px}
.aspect-opts .opt{flex:0 0 auto;width:212px;margin-bottom:0}
/* ===== V210 bottom panel + toolbar (CapCut-style) ===== */
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:#17171C;border-top:1px solid #26262E}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px 2px}
.panel-title{font-size:15px;font-weight:800;color:#F2F2F5}
.panel-done{padding:7px 16px;border-radius:999px;border:none;background:linear-gradient(90deg,#F59E0B,#F97316);color:#fff;font-weight:800;font-family:inherit;cursor:pointer;font-size:13px;flex:0 0 auto}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 18px}
.toolbar{flex:0 0 auto;display:flex;gap:2px;overflow-x:auto;background:#101014;border-top:1px solid #26262E;padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
.tool-btn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:48px;padding:4px 3px;border:none;background:transparent;color:#C9C9D2;font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;border-radius:10px}
.tool-btn .tic{font-size:16px;line-height:1}
.tool-btn.sel{color:#FBBF24;background:rgba(245,158,11,.12)}
/* ===== V230: Main row (mode/style + quick toggles) + column spacer =====
   The app column fills 100dvh and the toolbar is its LAST element: a
   flexible spacer above the toolbar absorbs every leftover pixel, so
   the toolbar always sits at the very bottom (it floated mid-screen
   whenever the old flex:1 panel was hidden). The Main row sits between
   the pinned frame and the timeline: the Original/New mode buttons +
   style chips (moved out of the Script sheet) and the SRT / Voice
   quick toggles, all in the slim compact chrome. */
.col-spacer{flex:1 1 auto;min-height:0}
.main-row{flex:0 0 auto;background:#101014;border-top:1px solid #26262E;padding:7px 10px 8px}
.main-row .style-row{margin-top:6px}
.quick-row{display:flex;align-items:center;gap:7px;margin-top:7px}
.qtgl{flex:0 0 auto;padding:5px 12px;border-radius:999px;border:1.5px solid #2C2C35;background:#1B1B21;color:#9A9AA5;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.qtgl.on{border-color:#F59E0B;background:rgba(245,158,11,.14);color:#FBBF24}
.create-mini{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#C9C9D2;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.create-mini .dot{width:8px;height:8px;border-radius:50%;background:#22C55E;flex:0 0 8px;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
/* V230 custom colour pickers (Subs / Title / Text sheets) */
.clr-inp{width:100%;height:38px;padding:3px;border-radius:11px;border:1.5px solid #2C2C35;background:#1B1B21;cursor:pointer}

   the source picture is shown WHOLE (contain) over a blurred copy of
   itself filling the rest of the canvas — nothing is ever cut — EXCEPT
   the standing special case: a 9:16 canvas with a LANDSCAPE source
   keeps the established layout (picture in a centred 1:1 region over
   the blur fill, subtitles BELOW the picture in the pad). The SAME
   geometry drives the preview stage and the export (canvasGeom /
   aspectSpecial916 below), so preview and export match 1:1. */

   preview stage classes. */

/* V221: export resolution — the chooser's 640/720/1080 is the canvas

   even-rounded exactly like canvasGeom. At 1080, the default, every

   geometry byte-for-byte. */

const DEF={aspect:'9:16',blur:28,voice:'Kore',subPosY:0.81,subColor:'white',subBand:false};
/* V210 subtitle containment: the subtitle band's TOP must stay within
   4%–88% of the frame height so the whole band is always inside the frame.
   ONE clamp shared by the preview slider + on-frame drag, the persisted
   setting and the export band mapping — what he sees is what exports. */
function clampSubPos(f){f=(typeof f==='number'&&isFinite(f))?f:0.81;return Math.max(0.04,Math.min(0.88,f))}
function loadSettings(){try{const s=Object.assign({},DEF,JSON.parse(localStorage.getItem('recaps_settings')||'{}'));if(ASPECT_MIGRATE[s.aspect])s.aspect=ASPECT_MIGRATE[s.aspect];if(!ASPECTS[s.aspect])s.aspect=DEF.aspect;return s}catch(e){return Object.assign({},DEF)}}
let SETTINGS=loadSettings();
function saveSettings(){localStorage.setItem('recaps_settings',JSON.stringify(SETTINGS))}
function getApiKey(){return (localStorage.getItem('recaps_gemini_key')||'').trim()}
function fmtSize(b){if(!b&&b!==0)return'—';if(b<1048576)return(b/1024).toFixed(0)+' KB';if(b<1073741824)return(b/1048576).toFixed(1)+' MB';return(b/1073741824).toFixed(2)+' GB'}
function fmtDur(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

function showNotice(msg,type){const n=$('#notice');n.textContent=msg;n.className='show '+(type||'info');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{n.className=''},5200)}
function showDone(title,text){$('#doneTitle').textContent=title;$('#doneText').textContent=text;$('#donePop').classList.add('show')}

/* bottom sheet */
/* Pinned-video geometry: the video frame (.vid-sticky) stays fixed at
   the top while features are edited, so sheets must open BELOW it —
   the sheet wrap starts at the pinned frame's bottom edge (the video
   stays fully visible and undimmed) and every pop-up is capped at
   min(68vh,100%) (V213, consistent across tools). --sheetTop is
   measured from the live layout and refreshed on resize, on video load
   and at every sheet open (the app bar is gone, so the offset is the
   frame height alone). */
function syncPinGeometry(){
 const fp=document.querySelector('.vid-sticky');const fh=(fp&&fp.offsetHeight)||0;
 const de=document.documentElement;
 if(de&&de.style&&de.style.setProperty){de.style.setProperty('--sheetTop',fh+'px')}
}
window.syncPinGeometry=syncPinGeometry;
if(window.addEventListener)window.addEventListener('resize',syncPinGeometry);
let sheetOnClose=null;
function flushSheet(){if(sheetOnClose){const f=sheetOnClose;sheetOnClose=null;try{f()}catch(e){}}}
function openSheet(title,html){syncPinGeometry();flushSheet();$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=html;$('#sheetWrap').classList.add('open');document.body.classList.add('locked')}
function openSheetNodes(title,node){syncPinGeometry();flushSheet();$('#sheetTitle').textContent=title;const b=$('#sheetBody');const home=node.parentElement,next=node.nextSibling;b.innerHTML='';b.appendChild(node);sheetOnClose=()=>{if(!home)return;if(next&&next.parentElement===home)home.insertBefore(node,next);else home.appendChild(node)};$('#sheetWrap').classList.add('open');document.body.classList.add('locked')}
function closeSheet(){flushSheet();const sw=$('#sheetWrap');sw.classList.remove('open');sw.classList.remove('voicePop');document.body.classList.remove('locked')}
$('#sheetBg').addEventListener('click',closeSheet);
/* V214: the frame's own ✕ (header) and ✓ ပြီး (footer) close EVERY sheet
   through the same closeSheet path as the backdrop */
$('#sheetClose').addEventListener('click',closeSheet);
$('#sheetDone').addEventListener('click',closeSheet);
/* IndexedDB library — resilient: the connection can enter a "closing" state
   (seen live after heavy ffmpeg.wasm exports), so reopen + retry instead of
   caching one connection forever. */
let _db=null,_dbOpening=null;
function openDB(){
 if(_db)return Promise.resolve(_db);
 if(_dbOpening)return _dbOpening;
 _dbOpening=new Promise((res,rej)=>{const r=indexedDB.open('RecapsDB',2);
  r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('videos'))db.createObjectStore('videos',{keyPath:'id',autoIncrement:true});if(!db.objectStoreNames.contains('peaks'))db.createObjectStore('peaks',{keyPath:'sig'})};
  r.onsuccess=()=>{_db=r.result;_dbOpening=null;_db.onclose=()=>{_db=null};_db.onversionchange=()=>{try{_db.close()}catch(e){}_db=null};res(_db)};
  r.onerror=()=>{_dbOpening=null;rej(r.error)}});
 return _dbOpening}
async function idbTx(mode,fn){let lastErr=null;for(let a=0;a<3;a++){const db=await openDB();try{return await new Promise((res,rej)=>{const tx=db.transaction('videos',mode);const out={};fn(tx.objectStore('videos'),out);tx.oncomplete=()=>res(out.val);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('transaction aborted'))})}catch(e){lastErr=e;if(/closing|InvalidStateError/i.test((e.name||'')+' '+(e.message||''))){_db=null;continue}throw e}}throw lastErr}
async function idbAdd(item){return idbTx('readwrite',(s,o)=>{const q=s.add(item);q.onsuccess=()=>{o.val=q.result}})}
</script>

 /* subtitle position slider in the စာတန်း sheet (the on-frame drag still works) */
 const spEl=E('subPos');
 if(spEl){spEl.value=Math.round(clampSubPos(ed.subPosY)*100);spEl.addEventListener('input',()=>{const pv=parseFloat(spEl.value);ed.subPosY=clampSubPos((isNaN(pv)?81:pv)/100);applySubPos();updateSubPosLabel()});spEl.addEventListener('change',()=>{ed.subPosCustom=true;SETTINGS.subPosY=ed.subPosY;SETTINGS.subPosCustom=true;saveSettings()})}
 ed.subPosY=clampSubPos(ed.subPosY);
 /* V217 Subs completion: body COLOUR chips + background BAND toggle +
    page Reset. Colour/band feed subPngOpts (export PNGs) and
    renderSubOverlay (preview) from the same editor state. */
 const scWrap=E('subColors');
 const syncSubChips=()=>{if(scWrap)$$('#'+p+'-subColors .style-chip').forEach(c=>c.classList.toggle('sel',c.dataset.v===ed.subColor))};
 syncSubChips();
 if(scWrap)scWrap.addEventListener('click',e=>{const b=e.target.closest('.style-chip');if(!b)return;ed.subColor=b.dataset.v;if(b.dataset.v==='gold'){ed.subColMain='#FFD740';ed.subColHi='#FFFFFF'}else{ed.subColMain='#FFFFFF';ed.subColHi='#FFD740'}persistOvl();syncSubPickers();syncSubChips();subRenderKey='';updateOverlay();refreshSummaries()});
 /* V230 custom subtitle colours: the two pickers write the single
    source of truth (ed.subColMain / ed.subColHi, read by the preview
    renderer and by subPngOpts for BOTH export engines). Colour never
    touches cue splitting (subLineFs depends on size only), so a
    colour change re-splits nothing and marks no voice stale — just
    the overlay re-render. A custom pick marks the preset 'custom'
    so neither preset chip stays selected. */
 const scMain=E('subColMain'),scHi=E('subColHi');
 const syncSubPickers=()=>{if(scMain)scMain.value=ed.subColMain;if(scHi)scHi.value=ed.subColHi};
 syncSubPickers();
 if(scMain)scMain.addEventListener('input',()=>{ed.subColMain=scMain.value;ed.subColor='custom';persistOvl();syncSubChips();subRenderKey='';updateOverlay();refreshSummaries()});
 if(scHi)scHi.addEventListener('input',()=>{ed.subColHi=scHi.value;ed.subColor='custom';persistOvl();syncSubChips();subRenderKey='';updateOverlay();refreshSummaries()});
 const sbT=E('subBandTgl');if(sbT){sbT.classList.toggle('on',!!ed.subBand);sbT.onclick=()=>{ed.subBand=!ed.subBand;SETTINGS.subBand=ed.subBand;saveSettings();sbT.classList.toggle('on',ed.subBand);subRenderKey='';updateOverlay();refreshSummaries()}}
 /* V224: subtitle SIZE slider — 'input' scales the preview live and
    persists; 'change' (release) re-derives the cues from the new
    canonical split (hand-edited cues are kept, per ensureCues' rule)
    and lets the stale-voice machinery flag any existing voice, since
    canonicalLines changed exactly as a script edit would change it */
 const ssI=E('subSize'),ssV=E('subSizeVal');
 if(ssI){ssI.value=ed.subSize||100;if(ssV)ssV.textContent=(ed.subSize||100)+'%';
  ssI.addEventListener('input',()=>{ed.subSize=parseInt(ssI.value,10)||100;if(ssV)ssV.textContent=ed.subSize+'%';persistOvl();subRenderKey='';updateOverlay()});
  ssI.addEventListener('change',()=>{if(!ed.cuesManual&&scriptLines().length)rebuildCues();checkVoiceStale();refreshSummaries()})}
 const subR=E('subReset');if(subR)subR.onclick=()=>{ed.subColor='white';ed.subBand=false;ed.subSize=100;ed.subColMain='#FFFFFF';ed.subColHi='#FFD740';SETTINGS.subColor='white';SETTINGS.subBand=false;SETTINGS.subSize=100;SETTINGS.subColMain='#FFFFFF';SETTINGS.subColHi='#FFD740';saveSettings();syncSubChips();syncSubPickers();if(sbT)sbT.classList.remove('on');if(ssI){ssI.value=100;if(ssV)ssV.textContent='100%'}subRenderKey='';E('subPosReset').click();updateOverlay();if(!ed.cuesManual&&scriptLines().length)rebuildCues();checkVoiceStale();refreshSummaries();showNotice('↺ စာတန်း Setting မူလ ပြန်ထားပါပြီ','info')};
 /* V217 Title completion: size slider + page Reset (the drag lives
    with the overlay drags above) */
 const tiSize=E('titleSize');if(tiSize){tiSize.value=ed.titleSize||52;E('titleSizeVal').textContent=ed.titleSize||52;tiSize.addEventListener('input',()=>{ed.titleSize=parseInt(tiSize.value,10)||52;E('titleSizeVal').textContent=ed.titleSize;persistOvl();syncTitleOvl()})}
 /* V230 custom title colour: one picker -> ed.titleColor, read by
    the stage preview (syncTitleOvl) and by BOTH engines' title PNG */
 const tiCol=E('titleColor');if(tiCol){tiCol.value=ed.titleColor;tiCol.addEventListener('input',()=>{ed.titleColor=tiCol.value;persistOvl();syncTitleOvl();refreshSummaries()})}
 const tiR=E('titleReset');if(tiR)tiR.onclick=()=>{ed.titleSize=52;ed.titleX=0.5;ed.titleY=0.15;ed.titleColor='#FFE92E';if(tiCol)tiCol.value='#FFE92E';const ti=E('title');if(ti)ti.value='';const tg=E('titleTgl');if(tg)tg.classList.add('on');if(tiSize){tiSize.value=52;E('titleSizeVal').textContent='52'}persistOvl();syncTitleOvl();refreshSummaries();showNotice('↺ Title Setting မူလ ပြန်ထားပါပြီ','info')};
 /* V217 Trim page Reset: restore the full range through the same
    input events the sliders use, so every dependent view re-syncs */
 const trR=E('trimReset');if(trR)trR.onclick=()=>{const st=E('start'),en=E('end');if(!st||!en)return;st.value=0;en.value=(ed.duration||0).toFixed(1);st.dispatchEvent(new Event('input',{bubbles:true}));en.dispatchEvent(new Event('input',{bubbles:true}));showNotice('↺ Video တစ်ခုလုံး ပြန်ထား ပါပြီ','info')};
 /* V230: boot state — no sheet or panel open; every control block sits in its parking home */
 refreshSummaries();
 updateCueCount();refreshVoiceGate();updateVoiceWarn();applySubPos();updateSubPosLabel();setSyncDelay(0);updateModeUI();syncTitleOvl();syncTextOvl();syncLogoOvl();syncBorderOvl();tpSync();renderTimeline();syncBlurLayer();blurListRender();blurCtlSync();
})();
